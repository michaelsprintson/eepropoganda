<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praha · Wien · Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed OSM map as the canvas; a floating "station card" panel drives the camera like Prezi frames. */
:root {
  --bg: #d5dee2;
  --land: #e9ece8;
  --land-hi: #f8f8f5;
  --border: #a9b3b1;
  --water: #a7c4d1;
  --green: #d2e1cb;
  --road: #ffffff;
  --casing: #cfd4d0;
  --building: #d9dbd4;
  --rail: #7b878c;
  --ink: #1d282d;
  --ink-2: #57646b;
  --panel: rgba(255, 255, 255, 0.94);
  --line: #dbe1e0;
  --chip: #eef1f0;
  --vienna: #c9920c;
  --prague: #c23a2e;
  --munich: #2a64ad;
  --split: #12857f;
  --tram: #d4483c;
  --bus: #7d5cc0;
  --board: #15191c;
  --board-ink: #f5c04a;
  --board-dim: #8b9196;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1114; --land: #172026; --land-hi: #1e2930; --border: #3a4952; --water: #173343;
    --green: #1b2d24; --road: #3b4850; --casing: #10171b; --building: #283239; --rail: #6d7b82;
    --ink: #e7ecec; --ink-2: #9ba8ae; --panel: rgba(20, 27, 32, 0.94); --line: #2b373e; --chip: #222d33;
    --vienna: #f0b630; --prague: #e8584c; --munich: #5b95dc; --split: #2fb8b0; --tram: #f06a5c; --bus: #a98be6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1114; --land: #172026; --land-hi: #1e2930; --border: #3a4952; --water: #173343;
  --green: #1b2d24; --road: #3b4850; --casing: #10171b; --building: #283239; --rail: #6d7b82;
  --ink: #e7ecec; --ink-2: #9ba8ae; --panel: rgba(20, 27, 32, 0.94); --line: #2b373e; --chip: #222d33;
  --vienna: #f0b630; --prague: #e8584c; --munich: #5b95dc; --split: #2fb8b0; --tram: #f06a5c; --bus: #a98be6; color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: var(--gl); padding-right: var(--gr); padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#map.pointing { cursor: pointer; }
canvas#map:active { cursor: grabbing; }

#panel {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: var(--gl); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column; justify-content: flex-start;
  pointer-events: none; z-index: 5;
}
#card {
  pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 10px 40px rgba(10, 20, 25, 0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 22px 24px 20px; overflow-y: auto; max-height: 100%; min-width: 0;
  transition: opacity .25s ease, transform .25s ease;
}
#card.swap { opacity: 0; transform: translateY(6px); }
body.roam #panel { display: none; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-2)); flex: none; }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; line-height: 1; margin: 0 0 12px; text-wrap: balance; }
h1 { font-size: 46px; text-transform: uppercase; }
h1 .arrow { color: var(--ink-2); font-weight: 500; padding: 0 .12em; }
h2 { font-size: 36px; }
h2 small { font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--ink-2); letter-spacing: 0; margin-left: 8px; }
.lede { margin: 0 0 16px; color: var(--ink); max-width: 60ch; }
.muted { color: var(--ink-2); }
.hint { font-size: 13px; color: var(--ink-2); margin: 14px 0 0; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--chip); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 4px; }
.stats div { border-top: 2px solid var(--ink); padding-top: 6px; }
.stats dt { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.stats dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }

/* strip map, like the line diagram above train doors */
.strip { list-style: none; margin: 4px 0 0; padding: 0; }
.strip li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; position: relative; }
.strip li::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.strip li:first-child::before { top: 12px; }
.strip li:last-child::before { bottom: calc(100% - 12px); }
.strip .stop .node { width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--c); position: relative; z-index: 1; margin-top: 1px; }
.strip .stop b { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.1; display: block; }
.strip .stop span { font-size: 13px; color: var(--ink-2); }
.strip .stop div { padding-bottom: 6px; }
.strip .ride { min-height: 34px; }
.strip .ride div { grid-column: 2; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); padding: 6px 0 10px; }
.strip .ride.opt::before { background: repeating-linear-gradient(var(--line) 0 5px, transparent 5px 9px); }

.places { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.places li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 9px 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; }
.places li:hover, .places li:focus-visible { background: var(--chip); outline: none; }
.places li:focus-visible { box-shadow: inset 0 0 0 2px var(--c); }
.places .name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; line-height: 1.25; }
.places .name .badge { width: 20px; height: 20px; font-size: 12px; margin: 0; flex: none; }
.places .name .badge.stay { padding-top: 4px; }
.places .txt { min-width: 0; }
.thumb { width: 92px; height: 92px; object-fit: cover; border-radius: 4px; background: var(--chip); display: block; }
.back { display: flex; justify-content: space-between; gap: 8px; margin: -4px 0 12px; font-size: 13px; color: var(--ink-2); }
.back a { color: var(--ink); font-weight: 600; }
.back span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; align-self: center; }
.sub { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.sub .ring { width: 16px; height: 16px; }
.hoods { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.hoods b { color: var(--ink); font-weight: 600; margin-right: 4px; }
.when { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.places a[data-go] { color: var(--ink); }
.badge.nature { clip-path: polygon(50% 4%, 100% 96%, 0 96%); border-radius: 0; padding-top: 7px; }
.badge.daytrip { border-radius: 50%; box-shadow: inset 0 0 0 3px color-mix(in srgb, #000 22%, var(--c)); }
.legend { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin: 14px 0 0; font-size: 13px; color: var(--ink-2); align-items: start; }
.legend b { color: var(--ink); font-weight: 600; }
.ring { display: inline-block; flex: none; border: 2px solid var(--c); border-radius: 4px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.legend .ring { width: 24px; height: 20px; margin-top: 2px; }
.places p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.badge { width: 24px; height: 24px; display: grid; place-items: center; background: var(--c); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 14px; margin-top: 1px; }
.badge.food { border-radius: 50%; }
.badge.cafe { border-radius: 5px; }
.badge.sight { transform: rotate(45deg) scale(.82); border-radius: 3px; }
.badge.sight span { transform: rotate(-45deg); }
.badge.stay { clip-path: polygon(50% 0, 100% 42%, 100% 100%, 0 100%, 0 42%); border-radius: 0; padding-top: 5px; }
.places a { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--chip); color: var(--ink-2); padding: 1px 6px; border-radius: 3px; font-weight: 500; }
.chip.regional { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); }
.note { margin: 14px 0 0; font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--c, var(--line)); padding-left: 10px; }


/* departure board: a physical object, so it keeps one look in both themes */
.board { background: var(--board); color: var(--board-ink); border-radius: 5px; padding: 12px 12px 10px; font-family: var(--f-mono); font-size: 12.5px; margin: 4px 0 12px; overflow-x: auto; box-shadow: inset 0 0 0 1px #000, 0 2px 0 rgba(0,0,0,.15); }
.board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 280px; }
.board th { color: var(--board-dim); font-weight: 500; font-size: 10px; letter-spacing: .1em; text-align: left; padding: 0 6px 6px 0; border-bottom: 1px solid #2c3236; }
.board td { padding: 7px 8px 7px 0; border-bottom: 1px dashed #2a2f33; vertical-align: top; }
.board td.t, .board td.c { white-space: nowrap; }
.board td.c { text-align: right; padding-right: 0; }
.board .sub2 { display: block; color: var(--board-dim); font-size: 11px; margin-top: 2px; }
.board tr:last-child td { border-bottom: 0; }
.board tr.opt td { color: var(--board-dim); font-size: 10px; letter-spacing: .1em; padding: 12px 0 2px; border-bottom: 0; }
.board tr.total td { border-top: 1px solid #3a4045; border-bottom: 0; font-weight: 600; color: #fff; }
.board.sum tr.sec td { padding: 18px 0 8px; border-bottom: 2px solid #3a4045; color: var(--board-ink); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.board.sum tr.sec:first-child td { padding-top: 4px; }
.board.sum tr.opt td { padding: 10px 0 2px 10px; color: #e9ecee; font-size: 10.5px; }
.board.sum tr[data-g] td:first-child { box-shadow: inset 3px 0 0 var(--g); padding-left: 10px; }
.board.sum tr[data-g="a"] { --g: #f5c04a; }
.board.sum tr[data-g="b"] { --g: #6fb3e0; }
.board.sum tr.subt td { border-bottom: 0; font-weight: 600; color: #e9ecee; padding-bottom: 12px; }
.board.sum tr.total td { border-top: 0; padding: 8px 0 6px; }
.board td.t { font-weight: 600; font-size: 15px; }
.board td.op { color: #e9ecee; white-space: normal; }
.board .foot { color: var(--board-dim); font-size: 10px; margin-top: 8px; letter-spacing: .04em; }
.via { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.via b { color: var(--ink); font-weight: 600; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 4px 0 6px; }
.cal .wd { font: 600 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); text-align: center; padding-bottom: 2px; }
.cd { position: relative; min-height: 52px; border: 0; border-radius: 4px; padding: 4px 5px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  background: color-mix(in srgb, var(--a) 26%, var(--panel)); border-top: 3px solid var(--a); min-width: 0; }
.cd:hover, .cd:focus-visible { background: color-mix(in srgb, var(--a) 42%, var(--panel)); outline: none; }
.cd:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.cd.travel { background: linear-gradient(135deg, color-mix(in srgb, var(--a) 30%, var(--panel)) 0 50%, color-mix(in srgb, var(--b) 30%, var(--panel)) 50%); border-top: 3px solid transparent; border-image: linear-gradient(90deg, var(--a), var(--b)) 1; }
.cd.off { background: none; border-top: 3px solid var(--line); cursor: default; color: var(--ink-2); opacity: .45; }
.cd .n { font: 600 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.cd .t { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .i { position: absolute; top: 3px; right: 4px; font-size: 11px; }
.trav { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.trav li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.trav b { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; }
.checks { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
.checks li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 3px; margin-top: 3px; }

/* bottom nav */
#nav {
  position: fixed; left: var(--gl); right: var(--gr); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; z-index: 6; pointer-events: none;
}
#nav > * { pointer-events: auto; }
.btn { font: 600 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; height: 44px; min-width: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: 0 4px 16px rgba(10,20,25,.12); }
.btn:hover { background: var(--chip); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-bottom: 3px solid var(--nc, var(--ink-2)); }
.btn.primary:hover { background: var(--chip); }
#progress { flex: 1; display: flex; gap: 3px; align-items: center; height: 44px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; box-shadow: 0 4px 16px rgba(10,20,25,.12); }
#progress button { flex: 1; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; display: flex; align-items: center; min-width: 4px; }
#progress button i { display: block; width: 100%; height: 5px; border-radius: 2px; background: var(--c); opacity: .3; transition: opacity .2s, height .2s; }
#progress button.on i { opacity: 1; height: 9px; }
#progress button:hover i { opacity: .7; }
#progress button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 2px; }
#count { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-left: 8px; white-space: nowrap; }

#tip { position: fixed; z-index: 8; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 600 13px var(--f-body); padding: 7px 11px 8px; border-radius: 5px; box-shadow: 0 6px 20px rgba(10,20,25,.25); max-width: min(280px, calc(100vw - 32px)); border-top: 3px solid var(--c); }
#tip .n { display: block; font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
.tmenu { position: relative; }
.btn.wide { min-width: 250px; justify-content: flex-start; gap: 10px; }
.btn.wide .dates { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--ink-2); letter-spacing: .02em; }
#calBtn[aria-expanded="true"] { border-bottom: 3px solid var(--ink-2); }
.calpanel { position: fixed; z-index: 7; top: calc(70px + env(safe-area-inset-top, 0px)); right: var(--gr); width: min(540px, calc(100vw - 32px)); max-height: calc(100% - 160px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 40px rgba(10,20,25,.28); padding: 20px 22px 18px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.calpanel .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border: 0; background: none; color: var(--ink-2); font-size: 22px; cursor: pointer; border-radius: 4px; }
.calpanel .x:hover { background: var(--chip); }
.calpanel .cd { min-height: 58px; }
/* planner */
.pl-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 10px; }
.fld { display: grid; gap: 4px; font-size: 13px; margin: 0 0 10px; }
.fld > span { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.fld.inline { display: flex; align-items: center; gap: 8px; margin: 0; }
.fld input, .fld select, .fld textarea, .imp textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%; }
.fld.inline input { width: auto; }
.fld textarea, .imp textarea { resize: vertical; }
.seg { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 13px; }
.seg span { padding: 0 10px; font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.seg button { font: 600 13px var(--f-body); border: 0; border-left: 1px solid var(--line); background: none; color: var(--ink); padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.step { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 5px; font-size: 13px; }
.step .sw { display: none; }
.step .nv { min-width: 1.4em; text-align: center; font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; }
.sb { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--chip); color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; }
.sb:hover { border-color: var(--ink-2); }
.steps .tot { margin-left: auto; font: 600 11px var(--f-mono); color: var(--ink-2); letter-spacing: .04em; }
.cal.planner .cd { min-height: 62px; padding-bottom: 6px; }
.cd.sel { box-shadow: 0 0 0 2px var(--ink); }
.cd.drop-ok { box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 999px color-mix(in srgb, var(--ink) 10%, transparent); }
.cd.drop-no { box-shadow: 0 0 0 2px #c2453a; }
.cd .tr { font-size: 10px; font-weight: 700; line-height: 1.15; color: var(--ink); background: color-mix(in srgb, var(--panel) 70%, transparent); border-radius: 3px; padding: 1px 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cd .nd { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.cd .grip { position: absolute; top: 18%; bottom: 18%; right: -4px; width: 8px; border-radius: 4px; background: var(--ink); opacity: .55; cursor: ew-resize; touch-action: none; z-index: 1; }
.cd .grip:hover { opacity: 1; }
.pl-status { margin: 2px 0 10px; font-size: 12.5px; color: var(--ink-2); min-height: 1.4em; }
.editor { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 4px; margin: 0 0 6px; background: color-mix(in srgb, var(--chip) 60%, transparent); }
.editor .eh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 0 0 10px; }
.editor .eh b { font: 600 13px var(--f-mono); }
.editor p a, .planned a, .hint a { color: var(--ink); font-weight: 600; }
.small { font-size: 12px; margin: -4px 0 10px; }
.palette { display: grid; gap: 8px; }
.pg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pgl { font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); min-width: 54px; border-left: 3px solid var(--c); padding-left: 6px; }

<script>
"use strict";
// ---------- projection (matches build/process.py) ----------
const R = 6378.137, D2R = Math.PI / 180, ORIGIN = [14, 49];
const merc = (lon, lat) => [R * lon * D2R, -R * Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2))];
const [OX, OY] = merc(...ORIGIN);
const P = (lon, lat) => { const [x, y] = merc(lon, lat); return [x - OX, y - OY]; };

// ---------- trip content ----------
const CITIES = {
  prague: { en: "Prague", local: "Praha", ll: [14.4213, 50.0875], nights: 4 },
  vienna: { en: "Vienna", local: "Wien", ll: [16.3725, 48.2085], nights: 4 },
  split: { en: "Split", local: "Split", ll: [16.4401, 43.5081], nights: 4 },
};
for (const c of Object.values(CITIES)) c.xy = P(...c.ll);
for (const id of Object.keys(CITIES)) Object.defineProperty(CITIES[id], "nights", { get: () => PLAN.nights[id] }); // edited in the planner


const TOWNS = [["Bratislava", 17.107, 48.148], ["Budapest", 19.040, 47.498], ["Dresden", 13.738, 51.050], ["Berlin", 13.405, 52.520],
  ["Zurich", 8.541, 47.377], ["Ljubljana", 14.506, 46.056], ["Kraków", 19.945, 50.065], ["Innsbruck", 11.404, 47.269],
  ["Nuremberg", 11.077, 49.452], ["Wrocław", 17.038, 51.108], ["Leipzig", 12.374, 51.340],
  ["Rijeka", 14.442, 45.327], ["Zadar", 15.231, 44.119], ["Šibenik", 15.896, 43.735], ["Sarajevo", 18.413, 43.856], ["Dubrovnik", 18.094, 42.650]];

// legs come from data/legs.json: stations [name, lon, lat, major?] plus a path traced along real OSM track in each city
let LEGS = {};
function buildLegs(data) {
  LEGS = data;
  for (const l of Object.values(LEGS)) {
    l.spts = l.stations.map(s => P(s[1], s[2]));
    l.pts = l.path;
    l.cum = [0];
    for (let i = 1; i < l.pts.length; i++) l.cum.push(l.cum[i - 1] + Math.hypot(l.pts[i][0] - l.pts[i - 1][0], l.pts[i][1] - l.pts[i - 1][1]));
  }
}

const BOARDS = {
  pv: { rows: [["4h 00", "Railjet · ČD / ÖBB", "every 2 h", "€20+"], ["4h 15", "RegioJet train", "several daily", "€15+"], ["4h 30", "FlixBus coach", "several daily", "€15+"]],
    via: "Pardubice · <b>Brno</b> · Břeclav", stop: "<b>Worth a stop:</b> Brno, a lively student city right at the halfway point. Easy lunch break." },
  vs: { rows: [["", "OPTION A · TRAIN + SLEEPER", "", ""], ["6h 30", "Day train to Zagreb · ÖBB / SŽ / HŽ", "1–2 daily", "€30+"], ["~9h", "Sleeper to Split · HŽ (summer)", "nightly", "€40+"],
      ["", "OPTION B · FLY", "", ""], ["1h 15", "Flight VIE → SPU · Austrian / Croatia Airlines", "daily in summer", "€80+"]],
    via: "<b>Semmering</b> · Graz · Maribor · <b>Zagreb</b> · Knin",
    stop: "<b>Option A:</b> about 6.5 h awake on the day train over the UNESCO-listed Semmering railway, an evening in Zagreb, then sleep through Lika and wake up on the coast. <b>Option B:</b> fly in 1h15 and skip Zagreb. The dashed arc on the map is the flight." },
  vp: { rows: [["4h 00", "Railjet · ÖBB / ČD", "every 2 h", "€20+"], ["4h 15", "RegioJet train", "several daily", "€15+"], ["4h 30", "FlixBus coach", "several daily", "€15+"]],
    via: "Břeclav · <b>Brno</b> · Pardubice", stop: "<b>Worth a stop:</b> Brno, a lively student city right at the halfway point. Easy lunch break." },
  pm: { rows: [["5h 45", "Direct EC · ČD / DB", "every 2 h", "€25+"], ["4h 45", "FlixBus coach", "many daily", "€20+"]],
    via: "<b>Plzeň</b> · Furth im Wald · <b>Regensburg</b> · Landshut", stop: "<b>Worth a stop:</b> Plzeň, home of Pilsner Urquell. The brewery tour is 1.5 h from Prague." },
  mv: { rows: [["4h 00", "Railjet · ÖBB", "every 1–2 h", "€30+"], ["1h 00", "Or fly home from MUC", "—", "—"]],
    via: "Rosenheim · <b>Salzburg</b> · Linz · St. Pölten", stop: "<b>Worth a stop:</b> Salzburg, Mozart's old town under the Alps, 1.5 h from Munich." },
};

const SEASON = {
  vienna: "In late August the locals head out and the city moves outdoors: wine taverns in the vineyards, long evenings in palace gardens, swimming in the Alte Donau. Expect 25–30°C.",
  prague: "Late summer means long evenings: beer gardens up on the hills, sunsets from the bridges, boats on the Vltava. Warm days around 25°C.",
  munich: "Beer gardens at their peak, and we beat the Oktoberfest crowds, which arrive in September. The lakes and the Alps are an hour away for a day trip.",
  split: "Late August is peak beach season: a warm sea around 24°C, long evenings on the Riva, and islands an hour away by boat. Expect 28–32°C.",
};
const EAT_TITLE = { vienna: "Schnitzel, ramen & tapas", prague: "Pilsner, pho & pasta", munich: "Beer, dumplings & more", split: "Fish, octopus & Croatian wine" };

let PLACES = [];        // flattened places with code + city
const DETAIL = {};      // day-trip zoom-in areas (salzburg, lednice) -> {en, local, parent}
let HOODS = {};         // city -> [{name, blurb, rings, label}] historic neighborhood outlines
const placeBy = {};     // `${city}:${code}`

function slideDeck() {
  const s = [];
  s.push({ id: "intro", color: "--ink-2", view: () => fitLL([11.5, 42.8, 19.5, 51.2]), html: introHTML });
  s.push({ id: "route", color: "--ink-2", view: () => fitPts(Object.values(CITIES).map(c => c.xy), 70), html: routeHTML });
  const order = [["prague", "pv", 1], ["vienna", "vs", 2], ["split", null, 3]];
  for (const [city, leg, n] of order) {
    s.push({ id: city, city, color: `--${city}`, focus: ["A", "B", "C", "D"], view: () => fitPts(cityPts(city, ["A", "B", "C", "D"]), 60), html: () => cityHTML(city, n) });
    const eat = PLACES.filter(p => p.city === city && (p.type === "food" || p.type === "cafe")).map(p => p.code); // every restaurant + the café
    s.push({ id: `${city}-eat`, city, color: `--${city}`, focus: eat, view: () => fitPts(cityPts(city, eat), 60), html: () => eatHTML(city) });
    s.push({ id: `${city}-stay`, city, color: `--${city}`, focus: ["H1", "H2", "H3"], view: () => { const pts = cityPts(city, ["H1", "H2", "H3"]); return pts.length ? fitPts(pts, 70, 2.6) : fitPts([CITIES[city].xy], 70, 4); }, html: () => stayHTML(city) });
    s.push({ id: `${city}-out`, city, color: `--${city}`, focus: ["T1", "T2", "T3", "T4"], view: () => fitPts([CITIES[city].xy, ...cityPts(city, ["T1", "T2", "T3", "T4"])], 70), html: () => outHTML(city) });
    for (const t of PLACES.filter(p => p.city === city && p.detail)) {
      const dc = t.detail;
      s.push({ id: dc, city: dc, side: `${city}-out`, color: `--${city}`, focus: ["A", "B", "C", "D"], view: () => fitPts(cityPts(dc, ["A", "B", "C", "D"]), 60), html: () => detailHTML(dc, t) });
    }
    if (!leg) continue;
    s.push({ id: leg, leg, color: `--${LEGS[leg].from}`, color2: `--${LEGS[leg].to}`, view: () => fitPts(LEGS[leg].pts, 70), html: () => legHTML(leg, n) });
    // stopovers on this leg (e.g. an evening in Zagreb between trains) follow the leg in the main flow
    for (const [dc, d] of Object.entries(DETAIL)) if (d.stop === leg)
      s.push({ id: dc, city: dc, color: `--${LEGS[leg].to}`, focus: ["A", "B", "C", "D", "1"], view: () => fitPts(cityPts(dc, ["A", "B", "C", "D", "1"]), 60), html: () => stopHTML(dc) });
  }
  s.push({ id: "in", color: "--ink-2", view: () => fitPts(Object.values(CITIES).map(c => c.xy), 70), html: wrapHTML });
  // human-readable names for the progress bar preview
  const LBL = { intro: "Intro: the trip at a glance", route: "The route: one line across the map", in: "Summary: travel times & costs" };
  const PART = { eat: "eat & drink", stay: "where to stay (Airbnbs)", out: "day trips & nature" };
  for (const sl of s) {
    if (LBL[sl.id]) sl.label = LBL[sl.id];
    else if (sl.leg) { const L = LEGS[sl.leg]; sl.label = `Train: ${CITIES[L.from].en} → ${CITIES[L.to].en}${L.optional ? " (optional)" : ""}${sl.leg === "vs" ? " (day train + sleeper)" : ""}`; }
    else if (DETAIL[sl.id]) sl.label = DETAIL[sl.id].stop ? `Stopover: an evening in ${DETAIL[sl.id].en}` : `Day trip zoom-in: ${DETAIL[sl.id].en}`;
    else { const [c, part] = sl.id.split("-"); sl.label = `${CITIES[c].en}: ${PART[part] || "sights & historic neighborhoods"}`; }
  }
  return s;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { regional: "Regional", splurge: "Splurge", cafe: "Café", world: "World food", nature: "Nature", daytrip: "Day trip" };

function introHTML() {
  const fly = PLAN.legs.vs.opt === "flight";
  return `<p class="eyebrow">${planRange()} ${DAYS[0].date.getFullYear()} · ${DAYS.length} days</p>
  <h1>Praha <span class="arrow">→</span> Wien <span class="arrow">→</span> Split</h1>
  <p class="lede">Two old imperial capitals, then a sleeper train down to the Adriatic. Castles, coffee houses and wine taverns first, then sea, islands and old stone.</p>
  <dl class="stats"><div><dt>Cities</dt><dd>3</dd></div><div><dt>Nights</dt><dd>${totalNights()}</dd></div><div><dt>Of us</dt><dd>11</dd></div><div><dt>${fly ? "Travel" : "Awake on trains"}</dt><dd>${fly ? "~5.5 h" : "~10.5 h"}</dd></div></dl>
  <p class="hint">Press <kbd>→</kbd> or Next to fly through it, or open <b>Plan</b> at the top to move dates, nights and day trips around. Your plan is saved in this browser.</p>`;
}
function routeHTML() {
  const stop = (c, extra) => `<li class="stop" style="--c:var(--${c})"><span class="node"></span><div><b>${CITIES[c].en}</b><span>${CITIES[c].nights} nights${extra ? " · " + extra : ""}</span></div></li>`;
  const ride = (t, opt) => `<li class="ride${opt ? " opt" : ""}"><div>${t}</div></li>`;
  return `<p class="eyebrow">The plan</p><h2>One line across the map</h2>
  <p class="lede">Fly into Prague, ride the rails south to the sea, fly home from Split.</p>
  <ol class="strip">${stop("prague", "fly in to PRG")}${ride("Railjet · ~4 h")}${stop("vienna")}${ride(PLAN.legs.vs.opt === "flight" ? "Flight · 1h 15" : "Day train to Zagreb · ~6.5 h, evening in Zagreb, sleeper to Split · overnight")}${stop("split", "fly home from SPU")}</ol>`;
}
function badge(p) {
  return `<span class="badge ${p.type}"><span>${p.label || p.code}</span></span>`;
}
function thumb(p) {
  return p.img ? `<img class="thumb" src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">` : `<span class="thumb"></span>`;
}
function li(p, extra = "") {
  const chip = p.kind ? `<span class="chip ${p.kind === "regional" ? "regional" : ""}">${KIND[p.kind]} · ${esc(p.tag)}</span>` : "";
  return `<li tabindex="0" data-p="${p.city}:${p.code}">${thumb(p)}<div class="txt"><div class="name">${badge(p)}<span>${esc(p.name)}</span> ${chip}</div><p>${esc(p.blurb)}</p>${extra}</div></li>`;
}
function hoodList(city) {
  const hs = HOODS[city] || [];
  if (!hs.length) return "";
  return `<h3 class="sub"><span class="ring"></span>Historic neighborhoods</h3>
  <ul class="hoods">${hs.map(h => `<li><b>${esc(h.name)}</b> ${esc(h.blurb)}</li>`).join("")}</ul>`;
}
function plannedChip(p) {
  const at = tripDate(tripId(p));
  return `<p class="planned${at ? "" : " none"}"><span>${at ? "Planned" : "Not planned"}</span> ${at ? fmtDay(at.date) : ""} <a href="#" data-plan="1">${at ? "Change" : "Plan it"}</a></p>`;
}
function outHTML(city) {
  const c = CITIES[city];
  const trips = PLACES.filter(p => p.city === city && (p.type === "nature" || p.type === "daytrip"));
  const KINDT = { nature: "Nature", daytrip: "Day trip" };
  return `<p class="eyebrow"><span class="dot"></span>${c.local} · Out of town</p>

function readTheme() {

    road: g("--road"), casing: g("--casing"), building: g("--building"), rail: g("--rail"), ink: g("--ink"), ink2: g("--ink-2"),
    vienna: g("--vienna"), prague: g("--prague"), munich: g("--munich"), split: g("--split"), halo: g("--land-hi") };
  C.tram = g("--tram"); C.bus = g("--bus");

}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function resize() {

  for (const c of [cv, off]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  dirty = true;
}
let refit = 0;
addEventListener("resize", () => {

  clearTimeout(refit);
  refit = setTimeout(() => { if (slides[cur] && !openPlace) cvSel.interrupt().call(zoom.transform, slides[cur].view()); }, 150);

// ---------- geometry builders ----------
function addAbs(p, a, close) { p.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) p.lineTo(a[i], a[i + 1]); if (close) p.closePath(); }

function buildRegion(r) {
  S.countries = r.countries.map(c => { const p = new Path2D(); for (const poly of c.polys) for (const ring of poly) addAbs(p, ring, true); return { ...c, path: p }; });
  S.lakes = new Path2D(); for (const l of r.lakes) for (const ring of l) addAbs(S.lakes, ring, true);
  S.riversMajor = new Path2D(); S.riversMinor = new Path2D();

}
const POLY = new Set(["wa", "gr", "bd", "sea"]);
function buildCity(name, c) {
  const paths = {};
  for (const [layer, items] of Object.entries(c.layers)) {
    const p = new Path2D();
    for (const it of items) { if (POLY.has(layer)) for (const ring of it) addDelta(p, ring, true); else addDelta(p, it, false); }
    paths[layer] = p;
  }

  S.cities[name] = { origin: c.origin, paths, bounds: c.bounds, box: [ox + w / 1000, oy + n / 1000, ox + e / 1000, oy + s / 1000] };
  dirty = true;
}
// ---------- transit lines ----------
const TRANSIT = { subway: false, tram: false, bus: false };
try { Object.assign(TRANSIT, JSON.parse(localStorage.getItem("transit") || "{}")); } catch (e) {}
function buildTransit(name, t) {
  const c = S.cities[name]; if (!c) return;
  const mk = list => { const p = new Path2D(); for (const a of list) addDelta(p, a, false); return p; };
  c.transit = {
    tram: mk(t.tram), bus: mk(t.bus),
    subway: t.subway.map(l => {
      // label at the middle of the line's longest piece
      let best = l.paths[0] || [0, 0];
      for (const a of l.paths) if (a.length > best.length) best = a;
      let x = best[0], y = best[1]; const half = best.length / 4;
      for (let i = 2; i < best.length && i / 2 < half; i += 2) { x += best[i]; y += best[i + 1]; }
      return { ref: l.ref, color: l.color, path: mk(l.paths), at: [x, y] };

}
let transitLoading = false;
function ensureTransit() {
  if (transitLoading || !Object.values(TRANSIT).some(Boolean)) return;
  transitLoading = true;
  for (const name of Object.keys(CITIES)) {
    const load = () => S.cities[name] ? fetch(`data/transit_${name}.json?v=${DATA_V}`).then(r => r.json()).then(t => buildTransit(name, t)).catch(() => {}) : setTimeout(load, 400);

function drawTransit(name, alpha) {

  if (!t) return;
  const s = k / 1000, px = 1 / s;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (T.x + c.origin[0] * k), dpr * (T.y + c.origin[1] * k));

    for (const l of t.subway) { ctx.strokeStyle = l.color; ctx.lineWidth = Math.max(3.5 * px, 9); ctx.stroke(l.path); }

      if (!inView(x, y, 0)) continue;

}

function buildPlaces(data, stays, images) {
  PLACES = [];
  for (const [city, d] of Object.entries(data)) {
    if (d.detail) DETAIL[city] = { en: d.en, local: d.local, parent: d.parent };
    (d.food || []).forEach((p, i) => PLACES.push({ ...p, city, code: String(i + 1), type: "food" }));
    if (d.cafe) PLACES.push({ ...d.cafe, city, code: "CF", label: "C", type: "cafe" }); // own code: sight "C" would collide
    d.sights.forEach((p, i) => PLACES.push({ ...p, city, code: "ABCDEFG"[i], type: "sight" }));
    (d.trips || []).forEach((p, i) => PLACES.push({ ...p, city, code: `T${i + 1}`, label: String(i + 1), type: p.kind === "nature" ? "nature" : "daytrip", tag: p.time }));
    const seen = [];
    (stays[city] || []).forEach((s, i) => {
      if (!s.xy) return;
      let xy = s.xy.slice();
      while (seen.some(q => Math.hypot(q[0] - xy[0], q[1] - xy[1]) < 0.05)) xy = [xy[0] + 0.09, xy[1] - 0.05]; // nudge listings sharing a fuzzed spot
      seen.push(xy);
      const details = s.title.replace(/^.*?·\s*/, "");
      PLACES.push({ city, code: `H${i + 1}`, label: String(i + 1), type: "stay", name: s.desc || s.title, tag: details, blurb: details, url: s.url, xy });
    });
  }
  for (const p of PLACES) {
    placeBy[`${p.city}:${p.code}`] = p;
    const key = p.type === "stay" ? `airbnb:${p.url.split("/rooms/")[1].split("?")[0]}` : p.name;
    Object.assign(p, images[key] || {});
    if (p.img) p.img += `?v=${DATA_V}`;
    if (p.imgs) p.imgs = p.imgs.map(u => `${u}?v=${DATA_V}`);
  }
}
function cityPts(city, codes) { return codes.map(c => placeBy[`${city}:${c}`]).filter(Boolean).map(p => p.xy); }

// ---------- camera ----------
const zoom = d3.zoom().scaleExtent([0.35, 8000]).on("zoom", e => { T = e.transform; dirty = true; });
const cvSel = d3.select(cv).call(zoom);

function viewRect() {
  if (document.body.classList.contains("roam")) return { x: 0, y: 0, w: W, h: H };
  const pr = document.getElementById("card").getBoundingClientRect();
  const top = 70, bottom = 80;
  if (W >= 760) return { x: pr.right, y: top, w: W - pr.right, h: H - top - bottom };
  return { x: 0, y: top, w: W, h: Math.max(160, pr.top - top) };
}
function fitBox(b, pad = 56, minSpan = 0) {
  const r = viewRect();
  let [x0, y0, x1, y1] = b;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const bw = Math.max(x1 - x0, minSpan), bh = Math.max(y1 - y0, minSpan);
  const k = Math.min((r.w - 2 * pad) / bw, (r.h - 2 * pad) / bh);
  return d3.zoomIdentity.translate(r.x + r.w / 2 - cx * k, r.y + r.h / 2 - cy * k).scale(Math.max(k, 0.35));
}
function fitPts(pts, pad, minSpan = 1.5) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return fitBox([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], pad, minSpan);
}
function fitLL([w, s, e, n]) { const a = P(w, n), b = P(e, s); return fitBox([a[0], a[1], b[0], b[1]], 20); }

function flyTo(t1, after) {
  const r = viewRect();
  const c0 = [(r.x + r.w / 2 - T.x) / T.k, (r.y + r.h / 2 - T.y) / T.k], c1 = [(r.x + r.w / 2 - t1.x) / t1.k, (r.y + r.h / 2 - t1.y) / t1.k];
  const i = d3.interpolateZoom([c0[0], c0[1], r.w / T.k], [c1[0], c1[1], r.w / t1.k]);
  const dur = reduce ? 0 : Math.max(700, Math.min(3200, i.duration * 0.9));
  cvSel.interrupt().transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, t1).on("end", () => after && after());
}

// ---------- drawing ----------
const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
const toS = p => [p[0] * T.k + T.x, p[1] * T.k + T.y];
const inView = (x, y, m = 40) => x > -m && y > -m && x < W + m && y < H + m;

function text(str, x, y, { size = 12, weight = 600, fam = "--f-body", color = C.ink, align = "left", base = "middle", ls = 0, halo = 3, upper = false } = {}) {
  const fams = { "--f-body": '"Barlow", "Helvetica Neue", Arial, sans-serif', "--f-display": '"Barlow Condensed", "Arial Narrow", sans-serif', "--f-mono": '"IBM Plex Mono", Menlo, monospace' };
  ctx.font = `${weight} ${size}px ${fams[fam]}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if ("letterSpacing" in ctx) ctx.letterSpacing = ls + "px";
  const s = upper ? str.toUpperCase() : str;
  if (halo) { ctx.lineJoin = "round"; ctx.lineWidth = halo; ctx.strokeStyle = C.halo; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}

function drawCity(name, alpha) {
  const c = S.cities[name], k = T.k;
  const [a, b] = [toS([c.box[0], c.box[1]]), toS([c.box[2], c.box[3]])];
  if (b[0] < 0 || b[1] < 0 || a[0] > W || a[1] > H) return;
  const s = k / 1000, px = 1 / s, P2 = c.paths;
  oc.setTransform(1, 0, 0, 1, 0, 0); oc.globalCompositeOperation = "source-over"; oc.globalAlpha = 1;
  oc.clearRect(0, 0, off.width, off.height);
  oc.setTransform(dpr * s, 0, 0, dpr * s, dpr * (T.x + c.origin[0] * k), dpr * (T.y + c.origin[1] * k));
  oc.lineCap = "round"; oc.lineJoin = "round";
  if (P2.sea) { // coastal map: land everywhere, then the sea cut from the real coastline
    const [bw, bn, be, bs] = c.bounds;
    oc.fillStyle = C.landHi; oc.fillRect(bw, bn, be - bw, bs - bn);
    oc.fillStyle = C.water; oc.fill(P2.sea, "evenodd");
  }
  oc.fillStyle = C.green; oc.fill(P2.gr);
  oc.fillStyle = C.water; oc.fill(P2.wa, "evenodd");
  oc.strokeStyle = C.water; oc.lineWidth = Math.max(1.5 * px, 12); oc.stroke(P2.wl);
  const bA = smooth(140, 320, k);
  if (bA > 0) { oc.globalAlpha = bA; oc.fillStyle = C.building; oc.fill(P2.bd, "evenodd"); oc.globalAlpha = 1; }
  const r3 = smooth(40, 120, k);
  if (r3 > 0) { oc.globalAlpha = r3; oc.strokeStyle = C.casing; oc.lineWidth = Math.max(1.4 * px, 8 + 1.2 * px); oc.stroke(P2.r3); oc.strokeStyle = C.road; oc.lineWidth = Math.max(0.8 * px, 8); oc.stroke(P2.r3); oc.globalAlpha = 1; }
  oc.strokeStyle = C.casing; oc.lineWidth = Math.max(2.4 * px, 13 + 1.6 * px); oc.stroke(P2.r2);
  oc.strokeStyle = C.road; oc.lineWidth = Math.max(1.4 * px, 13); oc.stroke(P2.r2);
  oc.strokeStyle = C.casing; oc.lineWidth = Math.max(3.4 * px, 18 + 2 * px); oc.stroke(P2.r1);
  oc.strokeStyle = C.road; oc.lineWidth = Math.max(2.2 * px, 18); oc.stroke(P2.r1);
  oc.strokeStyle = C.rail; oc.lineWidth = Math.max(1 * px, 3); oc.setLineDash([5 * px, 3 * px]); oc.stroke(P2.rl); oc.setLineDash([]);

  oc.setTransform(1, 0, 0, 1, 0, 0); oc.globalCompositeOperation = "destination-out";
  const x0 = a[0] * dpr, y0 = a[1] * dpr, x1 = b[0] * dpr, y1 = b[1] * dpr;
  const f = Math.min(70 * dpr, (x1 - x0) * 0.08, (y1 - y0) * 0.08);
  for (const [gx0, gy0, gx1, gy1, rx, ry, rw, rh] of [
    [x0, 0, x0 + f, 0, x0, y0, f, y1 - y0], [x1, 0, x1 - f, 0, x1 - f, y0, f, y1 - y0],
    [0, y0, 0, y0 + f, x0, y0, x1 - x0, f], [0, y1, 0, y1 - f, x0, y1 - f, x1 - x0, f]]) {
    const g = oc.createLinearGradient(gx0, gy0, gx1, gy1); g.addColorStop(0, "#000"); g.addColorStop(1, "rgba(0,0,0,0)");

function legAt(L, f) {
  const target = f * L.cum[L.cum.length - 1];
  let i = 1; while (i < L.cum.length - 1 && L.cum[i] < target) i++;
  const t = (target - L.cum[i - 1]) / (L.cum[i] - L.cum[i - 1] || 1), a = L.pts[i - 1], b = L.pts[i];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

// flights drawn as dashed arcs: on their leg's slide, the route slide and the summary
const FLIGHTS = [{ leg: "vs", from: "vienna", to: "split", label: "✈ 1h15" }];
function drawFlights() {
  const sl = slides[cur] || {};
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const f of FLIGHTS) {
    if (!(sl.leg === f.leg || sl.id === "route" || sl.id === "in")) continue;
    const a = toS(CITIES[f.from].xy), b = toS(CITIES[f.to].xy);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
    const cx = mx + dy * 0.22, cy = my - dx * 0.22; // bow the arc to one side of the rail line
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(cx, cy, b[0], b[1]);
    ctx.setLineDash([2, 7]); ctx.lineCap = "round"; ctx.lineWidth = 3; ctx.strokeStyle = C.ink2; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.setLineDash([]);
    const lx = 0.25 * a[0] + 0.5 * cx + 0.25 * b[0], ly = 0.25 * a[1] + 0.5 * cy + 0.25 * b[1];
    text(f.label, lx, ly, { size: 12, weight: 600, fam: "--f-mono", color: C.ink2, align: "center", halo: 3.5 });
    ctx.globalAlpha = 1;
  }
}
function drawLegs(now) {
  const sl = slides[cur] || {}, k = T.k, cityFade = 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const order = Object.keys(LEGS).sort((a, b) => (a === sl.leg) - (b === sl.leg));
  for (const id of order) {
    const L = LEGS[id], active = sl.leg === id, dim = sl.leg && !active;
    const pts = L.pts.map(toS), sp = L.spts.map(toS);
    const g = ctx.createLinearGradient(pts[0][0], pts[0][1], pts[pts.length - 1][0], pts[pts.length - 1][1]);
    g.addColorStop(0.1, C[L.from]); g.addColorStop(0.9, C[L.to]);
    ctx.globalAlpha = (dim ? 0.5 : 1) * cityFade;
    const w = active ? 5 : 3;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.setLineDash([]);
    ctx.strokeStyle = C.halo; ctx.lineWidth = w + 4; ctx.stroke();
    ctx.strokeStyle = g; ctx.lineWidth = w;
    if (L.optional && !active) ctx.setLineDash([7, 6]);
    ctx.stroke(); ctx.setLineDash([]);
    if ((active && k > 1.2) || k > 3) {
      for (let i = 1; i < L.stations.length - 1; i++) {
        const st = L.stations[i], p = sp[i];
        if (!inView(p[0], p[1])) continue;
        const major = st[3];
        if (!major && !active && k < 6) continue;
        ctx.beginPath(); ctx.arc(p[0], p[1], major ? 4 : 2.6, 0, Math.PI * 2);
        ctx.fillStyle = C.halo; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = C.ink; ctx.stroke();
        if (active && (major || k > 2.4)) text(st[0], p[0] + 8, p[1], { size: major ? 12 : 11, weight: major ? 600 : 500, fam: "--f-mono", color: major ? C.ink : C.ink2 });
      }
    }
    ctx.globalAlpha = 1;
    if (active && !reduce && legT0) {
      const ph = ((now - legT0) / 6500) % 1.25;
      if (ph < 1) {
        const e = ph < 0.5 ? 2 * ph * ph : 1 - Math.pow(-2 * ph + 2, 2) / 2;
        const p = toS(legAt(L, e));
        ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, Math.PI * 2); ctx.fillStyle = C.ink; ctx.fill();
        ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, Math.PI * 2); ctx.fillStyle = C.halo; ctx.fill();
      }
    }
  }
}

function pinShape(type, x, y, r) {
  ctx.beginPath();
  if (type === "food") ctx.arc(x, y, r, 0, Math.PI * 2);
  else if (type === "cafe") { ctx.roundRect ? ctx.roundRect(x - r, y - r, 2 * r, 2 * r, r * 0.35) : ctx.rect(x - r, y - r, 2 * r, 2 * r); }
  else if (type === "nature") { ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.15, y + r * 0.85); ctx.lineTo(x - r * 1.15, y + r * 0.85); ctx.closePath(); }
  else if (type === "daytrip") ctx.arc(x, y, r * 1.05, 0, Math.PI * 2);
  else if (type === "stay") { ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r, y - r * 0.2); ctx.lineTo(x + r, y + r); ctx.lineTo(x - r, y + r); ctx.lineTo(x - r, y - r * 0.2); ctx.closePath(); }
  else { const d = r * 1.3; ctx.moveTo(x, y - d); ctx.lineTo(x + d, y); ctx.lineTo(x, y + d); ctx.lineTo(x - d, y); ctx.closePath(); }
}

function fontFor(o) {
  const fams = { "--f-body": '"Barlow", "Helvetica Neue", Arial, sans-serif', "--f-display": '"Barlow Condensed", "Arial Narrow", sans-serif', "--f-mono": '"IBM Plex Mono", Menlo, monospace' };
  return `${o.weight || 600} ${o.size || 12}px ${fams[o.fam || "--f-body"]}`;
}
const overlaps = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];

function drawPins() {
  const sl = slides[cur] || {}, k = T.k;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const show = smooth(28, 45, k), tripShow = smooth(1.2, 2.5, k);
  if (show <= 0 && tripShow <= 0) return;
  const focus = new Set(sl.city ? (sl.focus || []).map(c => `${sl.city}:${c}`) : []);
  const taken = [], labels = [];
  // keep labels out from under the card, nav and buttons
  for (const id of ["card", "nav", "tools"]) {
    const el = document.getElementById(id);
    if (!el || (id === "card" && document.body.classList.contains("roam"))) continue;
    const b = el.getBoundingClientRect();
    if (b.width) taken.push([b.left - 6, b.top - 6, b.right + 6, b.bottom + 6]);
  }
  // the suggested neighborhood: only on its stay slide, or when opened
  // historic neighborhoods: on a city's sights and stay slides, or anywhere while exploring
  for (const [city, hs] of Object.entries(HOODS)) {
    const on = sl.id === city || sl.id === `${city}-stay` || (!sl.city && !sl.leg) || document.body.classList.contains("roam");
    if (!on) continue;
    for (const h of hs) {
      ctx.globalAlpha = show;

function drawMarkers() {

        if (!st[3] || seen.has(st[0])) continue; seen.add(st[0]);

function draw(now) {

// ---------- slides ----------
const card = document.getElementById("card"), progress = document.getElementById("progress");

function stepFrom(i, dir) {
  let j = i + dir;
  if (!slides[i].side) while (slides[j] && slides[j].side) j += dir; // main flow skips side trips
  return Math.max(0, Math.min(slides.length - 1, j));
}
function go(i, { instant = false } = {}) {

  cur = i; legT0 = 0; closePop();
  document.getElementById("next").style.setProperty("--nc", `var(${slides[stepFrom(i, 1)].color})`);
  card.classList.add("swap");

    else flyTo(t1, () => { if (sl.leg) legT0 = performance.now(); });
  }, instant || reduce ? 0 : 180);

}
function buildNav() {

  progress.innerHTML = MAIN.map((si, k) => { const s = slides[si]; return `<button aria-label="Slide ${k + 1}: ${esc(s.label)}" style="--c:var(${s.color})"><i style="${s.color2 ? `background:linear-gradient(90deg,var(${s.color}),var(${s.color2}))` : ""}"></i></button>`; }).join("");
  const tip = document.getElementById("tip");

    const i = MAIN[k], sides = slides.filter(x => x.side === slides[i].id).length;
    tip.innerHTML = `<span class="n">${String(k + 1).padStart(2, "0")} / ${MAIN.length}${i === mainOf(cur) ? " · you are here" : ""}</span>${esc(slides[i].label)}${sides ? ` <span class="n">+ ${sides} side-trip maps</span>` : ""}`;
    tip.style.setProperty("--c", `var(${slides[i].color})`);
    tip.hidden = false;
    const r = b.getBoundingClientRect(), pr = progress.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left + r.width / 2 - w / 2)) + "px";
    tip.style.top = (pr.top - tip.offsetHeight - 8) + "px";

const calBtn = document.getElementById("calBtn"), calPanel = document.getElementById("calPanel");

function flash(msg) { plMsg = msg; const s = calPanel.querySelector(".pl-status"); if (s) s.textContent = msg; }

calPanel.addEventListener("click", e => {
  const t = e.target;

  const day = t.closest("[data-day]");

  const a = PLAN.nights[city] + delta, b = PLAN.nights[next] - delta;
  if (a < 1 || b < 1) { renderPlanner(); flash("Each city needs at least one night."); return; }
  PLAN.nights[city] = a; PLAN.nights[next] = b; plSel = null;
  plMsg = `${CITIES[city].en} ${a} night${a > 1 ? "s" : ""}, ${CITIES[next].en} ${b} night${b > 1 ? "s" : ""}.`;
  planChanged();
});
document.getElementById("calDates").textContent = planRange();
const tBtn = document.getElementById("transitBtn"), tMenu = document.getElementById("transitMenu");
function syncTransitUI() {
  for (const m of Object.keys(TRANSIT)) document.getElementById(`t-${m}`).checked = TRANSIT[m];
  tBtn.classList.toggle("on", Object.values(TRANSIT).some(Boolean));
  document.getElementById("transitNote").hidden = T.k > 18;
}
tBtn.onclick = e => { e.stopPropagation(); tMenu.hidden = !tMenu.hidden; tBtn.setAttribute("aria-expanded", !tMenu.hidden); syncTransitUI(); };
tMenu.addEventListener("change", e => {
  const m = e.target.dataset.mode; if (!m) return;
  TRANSIT[m] = e.target.checked;
  try { localStorage.setItem("transit", JSON.stringify(TRANSIT)); } catch (err) {}
  ensureTransit(); syncTransitUI(); dirty = true;
});
document.addEventListener("click", e => { if (!tMenu.hidden && !e.target.closest(".tmenu")) { tMenu.hidden = true; tBtn.setAttribute("aria-expanded", "false"); } });
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(stepFrom(cur, 1)); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(stepFrom(cur, -1)); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
  else if (e.key === "Escape") { closePop(); tMenu.hidden = true; tBtn.setAttribute("aria-expanded", "false"); setCal(false); }
  else if (e.key.toLowerCase() === "h") toggleRoam();
});
card.addEventListener("click", e => {
  const jump = e.target.closest("[data-go]");
  if (jump) { e.preventDefault(); e.stopPropagation(); go(slides.findIndex(s => s.id === jump.dataset.go)); return; }
  if (e.target.closest("[data-plan]")) { e.preventDefault(); e.stopPropagation(); setCal(true); return; }
  const li = e.target.closest("[data-p]"); if (!li) return;
  focusPlace(placeBy[li.dataset.p]);
});
card.addEventListener("keydown", e => {
  const li = e.target.closest("[data-p]");
  if (li && (e.key === "Enter")) { e.preventDefault(); focusPlace(placeBy[li.dataset.p]); }
});
function focusPlace(p) {
  closePop();
  const r = viewRect(), k = Math.max(T.k, p.type === "area" ? 260 : p.type === "stay" ? 380 : 520);
  flyTo(d3.zoomIdentity.translate(r.x + r.w / 2 - p.xy[0] * k, r.y + r.h / 2 - p.xy[1] * k).scale(k), () => openPop(p));
}

// map clicks: pins and city markers
function hitAt(ev) {
  const b = cv.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top;
  let best = null, bd = Infinity;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } }
  return best;
}
cv.addEventListener("click", ev => {
  const h = hitAt(ev);
  if (!h) { if (openPlace) closePop(); return; }
  if (h.place) openPop(h.place);
  else if (h.city) go(slides.findIndex(s => s.id === h.city));
});
addEventListener("hashchange", () => {
  const i = slides.findIndex(s => s.id === location.hash.slice(1));
  if (i >= 0 && i !== cur) go(i);
});
cv.addEventListener("mousemove", ev => cv.classList.toggle("pointing", !!hitAt(ev)));

// ---------- boot ----------
const DATA_V = "16"; // bump when data files change so browsers don't reuse stale copies
async function boot() {
  readTheme(); resize();
  requestAnimationFrame(loop);
  const [region, places, stays, images, legs, hoods] = await Promise.all(["region", "places", "stays", "images", "legs", "hoods"].map(n => fetch(`data/${n}.json?v=${DATA_V}`).then(r => r.json())));
  buildRegion(region); buildLegs(legs); buildPlaces(places, stays, images); HOODS = hoods;
  TRIPS = PLACES.filter(p => p.type === "nature" || p.type === "daytrip");
  DAYS = buildDays();
  slides = slideDeck(); buildNav();
  document.getElementById("loading").remove();
  const h = location.hash.slice(1), start = Math.max(0, slides.findIndex(s => s.id === h));
  go(start, { instant: true });
  if (sharedPending) setCal(true); // someone sent a plan: show it with the keep / discard choice
  document.fonts && document.fonts.ready.then(() => { dirty = true; });
  ensureTransit(); syncTransitUI();
  readTheme();
  for (const name of [...Object.keys(CITIES), ...Object.keys(DETAIL)]) {
    fetch(`data/${name}.json?v=${DATA_V}`).then(r => r.json()).then(c => buildCity(name, c)).catch(() => {});
  }
}
boot().catch(err => { document.getElementById("loading").textContent = "The map data didn't load. Reload the page to try again."; console.error(err); });
</script>
