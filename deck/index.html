<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praha · Wien · Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
@property --a { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --b { syntax: "<color>"; inherits: true; initial-value: transparent; }
/* Layout: full-bleed OSM map as the canvas; a floating "station card" panel drives the camera like Prezi frames. */
:root {
  --bg: #d5dee2;
  --land: #e9ece8;
  --land-hi: #f8f8f5;
  --border: #a9b3b1;
  --water: #a7c4d1;
  --green: #d2e1cb;
  --road: #ffffff;
  --casing: #cfd4d0;
  --building: #d9dbd4;
  --rail: #7b878c;
  --ink: #1d282d;
  --ink-2: #57646b;
  --panel: rgba(255, 255, 255, 0.94); --panel-solid: #fff;
  --stage: rgba(8, 12, 14, 0.92); --stage-ink: #dfe6e8;
  --line: #dbe1e0;
  --chip: #eef1f0;
  --vienna: #c9920c;
  --prague: #c23a2e;
  --split: #12857f;
  --zagreb: #b8478a;
  --tram: #d4483c;
  --bus: #7d5cc0;
  --board: #15191c;
  --board-ink: #f5c04a;
  --board-dim: #8b9196;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1114; --land: #172026; --land-hi: #1e2930; --border: #3a4952; --water: #173343;
    --green: #1b2d24; --road: #3b4850; --casing: #10171b; --building: #283239; --rail: #6d7b82;
    --ink: #e7ecec; --ink-2: #9ba8ae; --panel: rgba(20, 27, 32, 0.94); --panel-solid: #141b20; --line: #2b373e; --chip: #222d33;
    --vienna: #f0b630; --prague: #e8584c; --split: #2fb8b0; --zagreb: #e07cb6; --tram: #f06a5c; --bus: #a98be6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1114; --land: #172026; --land-hi: #1e2930; --border: #3a4952; --water: #173343;
  --green: #1b2d24; --road: #3b4850; --casing: #10171b; --building: #283239; --rail: #6d7b82;
  --ink: #e7ecec; --ink-2: #9ba8ae; --panel: rgba(20, 27, 32, 0.94); --panel-solid: #141b20; --line: #2b373e; --chip: #222d33;
  --vienna: #f0b630; --prague: #e8584c; --split: #2fb8b0; --zagreb: #e07cb6; --tram: #f06a5c; --bus: #a98be6; color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: var(--gl); padding-right: var(--gr); padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#map.pointing { cursor: pointer; }
canvas#map:active { cursor: grabbing; }

#panel {
  position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: var(--gl); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column; justify-content: flex-start;
  pointer-events: none; z-index: 5;
}
#card {
  pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 10px 40px rgba(10, 20, 25, 0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 22px 24px 20px; overflow-y: auto; min-height: 0; min-width: 0; flex: 1 1 auto; /* fills the column, so the slide buttons sit at the same spot on every slide */
  transition: opacity .25s ease, transform .25s ease;
}
#card.swap { opacity: 0; transform: translateY(6px); }
/* back / forward through the city's slides: its own bar under the card, so it never scrolls away */
#cardNav { pointer-events: auto; flex: none; order: -1; margin-bottom: 8px; } /* above the card: right under the city tabs */
#cardNav[hidden] { display: none; }
#cardNav .sw { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 6px 20px rgba(10, 20, 25, 0.14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#cardNav .sw button { min-width: 0; min-height: 50px; padding: 6px 3px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font: 600 12.5px var(--f-body); color: var(--ink); background: none; border: 0; border-radius: 4px; cursor: pointer; }
#cardNav .sw button span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cardNav .sw svg { width: 19px; height: 19px; fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#cardNav .sw button:hover { background: var(--chip); }
#cardNav .sw button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
#cardNav .sw button.on { background: var(--c); color: var(--panel-solid); }
#cardNav .sw button.on svg { stroke: var(--panel-solid); }
#cardNav .sw button.last { box-shadow: inset 0 0 0 2px var(--c); } /* on a day: the slide the card shows, though the map shows the day */
body.roam #panel { display: none; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.eyebrow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-2)); flex: none; }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; line-height: 1; margin: 0 0 12px; text-wrap: balance; }
h1 { font-size: 46px; text-transform: uppercase; }
h1 .arrow { color: var(--ink-2); font-weight: 500; padding: 0 .12em; }
h2 { font-size: 36px; }
h2 small { font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--ink-2); letter-spacing: 0; margin-left: 8px; }
.lede { margin: 0 0 16px; color: var(--ink); max-width: 60ch; }
.muted { color: var(--ink-2); }
.hint { font-size: 13px; color: var(--ink-2); margin: 14px 0 0; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--chip); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 4px; }
.stats div { border-top: 2px solid var(--ink); padding-top: 6px; }
.stats dt { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.stats dd { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }


.places { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.places li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 9px 8px; margin: 0 -8px; border-radius: 5px; cursor: pointer; }
.places li:hover, .places li:focus-visible { background: var(--chip); outline: none; }
.places li:focus-visible { box-shadow: inset 0 0 0 2px var(--c); }
.places .name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; line-height: 1.25; }
.places .ract { position: relative; margin-left: auto; flex: none; width: 30px; height: 28px; display: grid; place-items: center; font-size: 14px; color: var(--ink); background: none; border: 1px solid transparent; border-radius: 5px; cursor: pointer; opacity: .4; }
.places .ract:hover, .places .ract:focus-within, .places .ract.on { opacity: 1; }
.places .ract:hover, .places .ract:focus-within { border-color: var(--line); background: var(--panel); }
.places .ract.on { background: color-mix(in srgb, var(--c) 18%, transparent); }
.places .ract select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.places .txt { min-width: 0; }
.thumb { width: 92px; height: 92px; object-fit: cover; border-radius: 4px; background: var(--chip); display: block; }
.back { display: flex; justify-content: space-between; gap: 8px; margin: -4px 0 12px; font-size: 13px; color: var(--ink-2); }
.back a { color: var(--ink); font-weight: 600; }
.back span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; align-self: center; }
.sub { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.sub .ring { width: 16px; height: 16px; }
.hoods { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.hoods b { color: var(--ink); font-weight: 600; margin-right: 4px; }
.when { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.places a[data-go] { color: var(--ink); }
.legend { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin: 14px 0 0; font-size: 13px; color: var(--ink-2); align-items: start; }
.legend b { color: var(--ink); font-weight: 600; }
.ring { display: inline-block; flex: none; border: 2px solid var(--c); border-radius: 4px; background: color-mix(in srgb, var(--c) 14%, transparent); }
.legend .ring { width: 24px; height: 20px; margin-top: 2px; }
.places p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.places a { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--chip); color: var(--ink-2); padding: 1px 6px; border-radius: 3px; font-weight: 500; }
.chip.regional { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); }
.note { margin: 14px 0 0; font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--c, var(--line)); padding-left: 10px; }


/* departure board: a physical object, so it keeps one look in both themes */
.board { background: var(--board); color: var(--board-ink); border-radius: 5px; padding: 12px 12px 10px; font-family: var(--f-mono); font-size: 12.5px; margin: 4px 0 12px; overflow-x: auto; box-shadow: inset 0 0 0 1px #000, 0 2px 0 rgba(0,0,0,.15); }
.board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 280px; }
.board th { color: var(--board-dim); font-weight: 500; font-size: 10px; letter-spacing: .1em; text-align: left; padding: 0 6px 6px 0; border-bottom: 1px solid #2c3236; }
.board td { padding: 7px 8px 7px 0; border-bottom: 1px dashed #2a2f33; vertical-align: top; }
.board td.t, .board td.c { white-space: nowrap; }
.board td.c { text-align: right; padding-right: 0; }
.board .sub2 { display: block; color: var(--board-dim); font-size: 11px; margin-top: 2px; }
.board tr:last-child td { border-bottom: 0; }
.board tr.opt td { color: var(--board-dim); font-size: 10px; letter-spacing: .1em; padding: 12px 0 2px; border-bottom: 0; }
.board tr.total td { border-top: 1px solid #3a4045; border-bottom: 0; font-weight: 600; color: #fff; }
.board.sum tr.sec td { padding: 18px 0 8px; border-bottom: 2px solid #3a4045; color: var(--board-ink); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.board.sum tr.sec:first-child td { padding-top: 4px; }
.board.sum tr.opt td { padding: 10px 0 2px 10px; color: #e9ecee; font-size: 10.5px; }
.board.sum tr[data-g] td:first-child { box-shadow: inset 3px 0 0 var(--g); padding-left: 10px; }
.board.sum tr[data-g="a"] { --g: #f5c04a; }
.board.sum tr[data-g="b"] { --g: #6fb3e0; }
.board.sum tr.subt td { border-bottom: 0; font-weight: 600; color: #e9ecee; padding-bottom: 12px; }
.board.sum tr.total td { border-top: 0; padding: 8px 0 6px; }
.board td.t { font-weight: 600; font-size: 15px; }
.board td.op { color: #e9ecee; white-space: normal; }
.board .foot { color: var(--board-dim); font-size: 10px; margin-top: 8px; letter-spacing: .04em; }
.via { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.via b { color: var(--ink); font-weight: 600; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 4px 0 6px; }
.cal .wd { font: 600 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); text-align: center; padding-bottom: 2px; }
.cd { position: relative; min-height: 52px; border: 0; border-radius: 4px; padding: 4px 5px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
  background: color-mix(in srgb, var(--a) 26%, var(--panel)); border-top: 3px solid var(--a); min-width: 0; }
.cd:hover, .cd:focus-visible { background: color-mix(in srgb, var(--a) 42%, var(--panel)); outline: none; }
.cd:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.cd.fly { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 14%, var(--panel)) 0 6px, var(--panel) 6px 12px); border-top: 3px dashed var(--a); }
.cd.fly .t { font-weight: 700; }
/* Wien → an evening in Zagreb → sleeper to Split: a Zagreb day, Wien's stripe on top and Split's along the bottom */
.cd.travel.zstop, .cal.planner.dragging .cd.travel.zstop:hover { background: color-mix(in srgb, var(--zagreb) 30%, var(--panel)); border-top: 3px solid var(--a); border-image: none; box-shadow: inset 0 -3px 0 var(--b); }
.cd.travel.zstop:hover { background: color-mix(in srgb, var(--zagreb) 44%, var(--panel)); }
.cd.travel.zstop.sel { box-shadow: inset 0 -3px 0 var(--b), 0 0 0 2px var(--ink); }
.cd.fly:hover, .cd.fly:focus-visible { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 22%, var(--panel)) 0 6px, var(--panel) 6px 12px); }
.cd.travel { background: linear-gradient(135deg, color-mix(in srgb, var(--a) 30%, var(--panel)) 0 50%, color-mix(in srgb, var(--b) 30%, var(--panel)) 50%); border-top: 3px solid transparent; border-image: linear-gradient(90deg, var(--a), var(--b)) 1; }
.cd.off { background: none; border-top: 3px solid var(--line); cursor: default; color: var(--ink-2); opacity: .45; }
.cd .n { font: 600 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.cd .t { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd .i { position: absolute; top: 3px; right: 4px; font-size: 11px; }
.checks { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
.checks li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 3px; margin-top: 3px; }

/* bottom nav */
#nav {
  position: fixed; left: var(--gl); right: var(--gr); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; z-index: 6; pointer-events: none;
}
#nav > * { pointer-events: auto; }
.btn { font: 600 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; height: 44px; min-width: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: 0 4px 16px rgba(10,20,25,.12); }
.btn:hover { background: var(--chip); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-bottom: 3px solid var(--nc, var(--ink-2)); }
.btn.primary:hover { background: var(--chip); }
#progress { flex: 1; display: flex; gap: 3px; align-items: center; height: 44px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; box-shadow: 0 4px 16px rgba(10,20,25,.12); }
#progress button { flex: 1; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; display: flex; align-items: center; min-width: 4px; }
#progress button i { display: block; width: 100%; height: 5px; border-radius: 2px; background: var(--c); opacity: .3; transition: opacity .2s, height .2s; }
#progress button.on i { opacity: 1; height: 9px; }
#progress button:hover i { opacity: .7; }
#progress button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-radius: 2px; }
#count { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-left: 8px; white-space: nowrap; }

#tip { position: fixed; z-index: 8; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font: 600 13px var(--f-body); padding: 7px 11px 8px; border-radius: 5px; box-shadow: 0 6px 20px rgba(10,20,25,.25); max-width: min(280px, calc(100vw - 32px)); border-top: 3px solid var(--c); }
#tip .n { display: block; font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
.tmenu { position: relative; }
.btn.wide { min-width: 250px; justify-content: flex-start; gap: 10px; }
.btn.wide .dates { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--ink-2); letter-spacing: .02em; }
#calBtn[aria-expanded="true"] { border-bottom: 3px solid var(--ink-2); }
.calpanel { position: fixed; z-index: 7; top: calc(70px + env(safe-area-inset-top, 0px)); right: var(--gr); width: min(540px, calc(100vw - 32px)); max-height: calc(100% - 160px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 40px rgba(10,20,25,.28); padding: 20px 22px 18px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.calpanel .x { position: absolute; z-index: 8; top: 8px; right: 8px; width: 34px; height: 34px; border: 0; background: none; color: var(--ink-2); font-size: 22px; cursor: pointer; border-radius: 4px; }
.calpanel .x:hover { background: var(--chip); }
.calpanel .phead .x { top: 50%; right: 6px; translate: 0 -50%; }
.calpanel .cd { min-height: 58px; }
/* planner */
.fld { display: grid; gap: 4px; font-size: 13px; margin: 0 0 10px; }
.fld > span { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.fld .how { font-size: 14px; font-weight: 600; line-height: 1.3; padding: 7px 0; }
.fld.inline { display: flex; align-items: center; gap: 8px; margin: 0; }
.fld input, .fld select, .fld textarea, .imp textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%; }
.fld.inline input { width: auto; }
.fld textarea, .imp textarea { resize: vertical; }
.seg { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 13px; }
.seg span { padding: 0 10px; font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.seg button { font: 600 13px var(--f-body); border: 0; border-left: 1px solid var(--line); background: none; color: var(--ink); padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--panel); }
.cal.planner .cd { min-height: 62px; padding-bottom: 6px; }
.cd.sel { box-shadow: 0 0 0 2px var(--ink); }
.cd .tr { font-size: 10px; font-weight: 700; line-height: 1.15; color: var(--ink); background: color-mix(in srgb, var(--panel) 70%, transparent); border-radius: 3px; padding: 1px 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cd .nd { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.cd .grip { position: absolute; top: 18%; bottom: 18%; right: -4px; width: 8px; border-radius: 4px; background: var(--ink); opacity: .55; cursor: ew-resize; touch-action: none; z-index: 1; }
.cd .grip:hover, .cd .grip.live { opacity: 1; }
.cal.planner.dragging { cursor: ew-resize; user-select: none; }
.cal.planner.dragging .cd { cursor: ew-resize; transition: --a .18s ease, --b .18s ease; }
.cal.planner.dragging .cd:hover { background: color-mix(in srgb, var(--a) 26%, var(--panel)); }
.cal.planner.dragging .cd.travel:hover { background: linear-gradient(135deg, color-mix(in srgb, var(--a) 30%, var(--panel)) 0 50%, color-mix(in srgb, var(--b) 30%, var(--panel)) 50%); }
.cd .grip.live { width: 10px; right: -5px; box-shadow: 0 0 0 2px var(--panel), 0 2px 8px rgba(0,0,0,.3); }
.pl-status { margin: 2px 0 10px; font-size: 12.5px; color: var(--ink-2); min-height: 1.4em; }
.editor { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 4px; margin: 0 0 6px; background: color-mix(in srgb, var(--chip) 60%, transparent); }

.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.imp { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; align-items: start; }
.copybox { width: 100%; margin-top: 8px; font: 11px var(--f-mono); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 6px; }
.banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; margin: 0 0 12px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 10%, var(--panel)); font-size: 13.5px; font-weight: 600; }

.planned.none > span { background: var(--chip); color: var(--ink-2); }
.board.sum.pick-a tr[data-g="b"], .board.sum.pick-a tr[data-t="b"], .board.sum.pick-b tr[data-g="a"], .board.sum.pick-b tr[data-t="a"] { opacity: .38; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(10,20,25,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; gap: 4px; }
.menu .mh { margin: 0 0 4px; font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.menu label { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
.menu label:hover { background: var(--chip); }
.menu input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.menu .sw { width: 22px; height: 4px; border-radius: 2px; flex: none; }
.menu .sw.subway { background: linear-gradient(90deg, #e2001a 0 33%, #0a6cb4 33% 66%, #8f6aa6 66%); height: 5px; }
.menu .sw.tram { background: var(--tram); }
.menu .sw.bus { background: var(--bus); height: 3px; }
.menu .mnote { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); }
#transitBtn[aria-expanded="true"], #transitBtn.on { border-bottom: 3px solid var(--tram); }
#tools { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: var(--gr); display: flex; gap: 8px; z-index: 6; }

#pop {
  position: fixed; left: 0; top: 0; z-index: 7; width: min(280px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 10px 30px rgba(10,20,25,.22); padding: 14px 16px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  /* opening and closing: scale and translate are separate from the transform that positions it */
  transition: opacity .16s ease, scale .24s cubic-bezier(.2, .9, .3, 1.12);
}

.hint .tch { display: none; }
@media (hover: none) { .hint .kb { display: none; } .hint .tch { display: inline; } }
@media (prefers-reduced-motion: reduce) { #pop { transition: none; } }
#pop .ph { display: block; width: calc(100% + 32px); margin: -14px -16px 10px; height: 150px; object-fit: cover; border-radius: 6px 6px 0 0; }

#pop .links a { color: var(--ink); }
#pop .x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; background: none; color: var(--ink-2); font-size: 20px; cursor: pointer; border-radius: 4px; }
#pop .x:hover { background: var(--chip); }
@media (max-width: 759px) { /* phones: a short card under the top bar, photo at the side, so it never hides the bar or runs under a sheet */
  #pop { z-index: 8; width: calc(100vw - var(--gl) - var(--gr)); box-sizing: border-box; padding: 10px 12px 9px; display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; align-items: start; }
  #pop > :not(.ph, .phs, .x) { grid-column: 2; }
  #pop:not(:has(.ph, .phs)) { grid-template-columns: minmax(0, 1fr); }
  #pop:not(:has(.ph, .phs)) > * { grid-column: 1; }
  #pop .ph, #pop .phs { grid-column: 1; grid-row: 1 / span 5; width: 76px; height: 76px; margin: 0; border-radius: 5px; }
  #pop .phs { grid-template-columns: 1fr; } #pop .phs img { height: 76px; } #pop .phs img + img { display: none; }
  #pop h4 { font-size: 18px; }
  #pop p { margin: 4px 0 6px; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #pop .links { font-size: 12px; }
  #pop .credit { margin-top: 4px; font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}

/* photo viewer: always a dark stage, whatever the theme */
#viewer { position: fixed; inset: 0; z-index: 20; background: var(--stage); display: grid; place-items: center; padding: 16px; }
#viewer figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; max-height: 100%; }
#viewer img { display: block; max-width: min(100%, calc(100vw - 32px)); max-height: calc(100vh - 110px); max-height: calc(100dvh - 110px); object-fit: contain; border-radius: 4px; background: rgba(255,255,255,.04); }
#viewer figcaption { color: var(--stage-ink); font-size: 13px; text-align: center; max-width: 720px; }
#viewer figcaption b { font-family: var(--f-display); font-size: 18px; font-weight: 700; margin-right: 6px; }
#viewer figcaption .n { font-family: var(--f-mono); font-size: 11px; opacity: .8; margin-right: 6px; }
#viewer figcaption a { color: var(--stage-ink); }
#viewer button { position: absolute; width: 44px; height: 44px; border: 0; border-radius: 6px; background: rgba(255,255,255,.1); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
#viewer button:hover, #viewer button:focus-visible { background: rgba(255,255,255,.22); outline: none; }
#viewer .vx { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; }
#viewer .vnav { top: 50%; transform: translateY(-50%); }
#viewer .prev { left: 12px; } #viewer .next { right: 12px; }
#viewer .vload { position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--stage-ink); opacity: 0; transition: opacity .2s; pointer-events: none; }
#viewer.loading .vload { opacity: .85; }
.thumb[src], #pop .ph, #pop .phs img { cursor: zoom-in; }

/* menu bar: a menu per city, like a desktop app's */
#menubar { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: var(--gl); z-index: 8; display: flex; align-items: center; }
.mbitems { display: flex; height: 44px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(10,20,25,.12); padding: 0 4px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.mbt { font: 600 14px var(--f-body); color: var(--ink); background: none; border: 0; padding: 0 12px; margin: 4px 0; cursor: pointer; position: relative; border-radius: 4px; }
.mbt::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--c); opacity: .25; }
.mbt.cur::after { opacity: 1; }
.mbt:hover, .mbt.open { background: var(--chip); }
.mbt:disabled { color: var(--ink-2); opacity: .45; cursor: default; background: none; }
.mbt:disabled::after { opacity: .12; }
.mbt:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.mbburger { display: none; }
#menubar:not(.compact) .mbitems { box-sizing: border-box; width: min(400px, calc(100vw - 32px)); } /* as wide as the switcher and card under it */
#menubar:not(.compact) .mbt { flex: 1; }
#menubar.compact .mbitems { display: none; }
#menubar.compact .mbburger { display: inline-flex; }
.mbmenu { position: fixed; top: calc(66px + env(safe-area-inset-top, 0px)); width: 320px; max-width: calc(100vw - 16px); max-height: calc(100vh - 100px); max-height: calc(100dvh - 100px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 40px rgba(10,20,25,.28); padding: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#menubar.compact .mbmenu { left: var(--gl); width: 220px; }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: 500 13.5px var(--f-body); color: var(--ink); background: none; border: 0; border-radius: 4px; padding: 5px 8px; cursor: pointer; min-height: 34px; }
.mi:hover, .mi:focus-visible { background: var(--chip); outline: none; }
.mi:disabled { opacity: .45; cursor: default; }
.mi.sec { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; justify-content: space-between; min-height: 28px; }
.mrow { display: flex; align-items: center; }
.mrow .mi:first-child { flex: 1; min-width: 0; }
.mi .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mi .when { font: 500 10.5px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.mi.side { width: 34px; flex: none; justify-content: center; padding: 5px 0; opacity: .5; }
.mi.side.on, .mi.side:hover, .mi.side:focus-visible { opacity: 1; }
.mi .ck { width: 14px; font-weight: 700; }
.mi.city { font: 700 17px var(--f-display); padding: 8px 10px; border-left: 3px solid var(--c); border-radius: 0 4px 4px 0; margin: 2px 0; min-height: 42px; }
.mi.city.cur { background: var(--chip); }

/* planner settings: one row per setting, labels in a column */
.pset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; overflow: hidden; }
.pset > .prow:first-child { border-top: 0; }
/* the panel's header: one thin centered line, pinned to the top as the panel scrolls, with the Share menu at its right */
.calpanel .phead { position: sticky; top: -20px; z-index: 6; margin: -20px -22px 10px; padding: 14px 22px 8px; background: var(--panel-solid); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.calpanel .phead h2 { grid-column: 2; margin: 0; font: 600 12px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.shareb { grid-column: 3; justify-self: end; font: 600 12.5px var(--f-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; cursor: pointer; }
.shareb:hover, .shareb.on { background: var(--chip); }
.shareb span { font-size: 10px; margin-left: 2px; }
body:not(.dock) .shareb { margin-right: 34px; } /* clear of the close button */
.smenu { position: absolute; top: calc(100% + 4px); right: 12px; width: 260px; display: grid; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgba(10, 20, 25, .22); }
.smenu > button { text-align: left; font: 500 13.5px var(--f-body); color: var(--ink); background: none; border: 0; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
.smenu > button:hover, .smenu > button:focus-visible { background: var(--chip); outline: none; }
.smenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }
.smenu .imp, .smenu .copybox { margin: 2px 4px 4px; width: auto; }
.smenu .confirm { padding: 4px 6px; flex-wrap: wrap; }
.prow { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
.prow .lab { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.prow .lab em { font: 500 11px var(--f-body); letter-spacing: 0; text-transform: none; font-style: normal; margin-left: 6px; }
.prow .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.prow input[type=date] { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
.prow .end { font: 500 11.5px var(--f-mono); color: var(--ink-2); }
.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg2 button { font: 600 13px var(--f-body); border: 0; background: none; color: var(--ink); padding: 7px 10px; cursor: pointer; }
.seg2 button + button { border-left: 1px solid var(--line); }
.seg2 button.on { background: var(--ink); color: var(--panel); }
.drange { font: 600 13.5px var(--f-body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.drange:hover, .drange.on { border-color: var(--ink-2); }
.rp { padding: 8px 12px 10px; border-top: 1px solid var(--line); }
.rph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
.rpg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rpg i { font: 600 10px var(--f-mono); font-style: normal; text-transform: uppercase; color: var(--ink-2); text-align: center; padding: 2px 0; }
.rpg button { height: 30px; border: 0; border-radius: 4px; background: none; font: 500 13px var(--f-body); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.rpg button:hover { background: var(--chip); }
.rpg button.in, .rpg button.hv { background: color-mix(in srgb, var(--ink) 12%, transparent); border-radius: 0; }
.rpg button.s, .rpg button.e { background: var(--ink); color: var(--panel); font-weight: 700; }
.rp p { margin: 6px 0 0; }

/* calendar cells: the day's pins as little badges */
.cd .pr { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.cd.drop-ok { box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 999px color-mix(in srgb, var(--ink) 10%, transparent); }
.cd.drop-no { opacity: .55; }
.cd .pb[draggable], .mi[draggable] { cursor: grab; }
canvas#map.grab { cursor: grab; }
body.pindrag, body.pindrag canvas#map { cursor: grabbing; }
#ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 6px;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pb { font: 700 10px var(--f-display); font-style: normal; height: 17px; padding: 0 4px 0 3px; border-radius: 4px; background: var(--c); color: #fff; display: inline-flex; align-items: center; gap: 2px; line-height: 1; }
.pb svg { width: 10px; height: 10px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.pb.eat { border-radius: 9px; } /* round like the restaurant markers on the map */
.pb.trip { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); } /* outlined: a whole day out */
.pb.trip svg { stroke: var(--c); }
/* the same chips, a size up, in the day's list, the place picker, the drag ghost */
.itin .pb, .pchip .pb, .lostl .pb, #ghost .pb, .places .pb, .mi .pb { height: 21px; font-size: 12px; padding: 0 6px 0 5px; gap: 3px; flex: none; }
.itin .pb svg, .pchip .pb svg, .lostl .pb svg, #ghost .pb svg, .places .pb svg, .mi .pb svg { width: 12px; height: 12px; }
.itin .pb.eat, .pchip .pb.eat, .lostl .pb.eat, #ghost .pb.eat, .places .pb.eat, .mi .pb.eat { border-radius: 11px; }

/* the selected day, in the planner */
.dayv { border: 1px solid var(--line); border-top: 3px solid var(--a); border-radius: 6px; padding: 10px 12px; margin: 0 0 8px; background: color-mix(in srgb, var(--chip) 60%, transparent); }
.dayv .dh { display: grid; grid-template-columns: 30px 1fr auto 30px; gap: 8px; align-items: center; margin-bottom: 8px; }
.dayv .dh b { font: 600 14px var(--f-mono); display: block; }
.dayv .dh span { font-size: 12px; color: var(--ink-2); }
.dayv h4 { font: 600 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 8px 0 6px; display: flex; justify-content: space-between; }
.ib { width: 28px; height: 28px; flex: none; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1; }
.ib:disabled { opacity: .35; cursor: default; }
.lostl { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.lostl li { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.lostl li > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add summary { cursor: pointer; font: 600 13px var(--f-body); margin: 4px 0 8px; }
.pkg { border-left: 3px solid var(--c); padding-left: 8px; margin: 0 0 10px; }
.pkh { font: 700 15px var(--f-display); display: block; margin-bottom: 4px; }
.pk { margin: 0 0 6px; }
.pkl { font: 600 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: block; margin-bottom: 4px; }
.pkc { display: flex; flex-wrap: wrap; gap: 4px; }
.pchip { display: inline-flex; align-items: center; gap: 5px; font: 500 12.5px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 2px 9px 2px 3px; cursor: pointer; max-width: 100%; }
.pchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pchip:disabled { opacity: .4; cursor: default; }
.pchip.in { font-size: 11.5px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; }

/* a day's route, on the card */
/* the day as a timetable: time | marker | name | length and (on hover) reorder; rides are quiet lines between */
.itin { list-style: none; margin: 4px 0 12px; padding: 0; }
.itin .st { position: relative; display: grid; grid-template-columns: 38px 40px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; padding: 4px 4px; margin: 0 -4px; border-radius: 5px; min-height: 34px; }
.itin .st[data-si] { cursor: pointer; }
.itin .st[draggable] { cursor: grab; }
.itin .st[data-si]:hover, .itin .st[data-si]:focus-visible { background: var(--chip); outline: none; }
.itin .tm { font: 600 12px var(--f-mono); color: var(--ink-2); text-align: right; }
.itin .mk { display: grid; place-items: center; }
.itin .nm { min-width: 0; }
.itin .nm b { display: block; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itin .nm small { display: block; color: var(--ink-2); font-size: 11.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itin .hub { width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 5px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--panel); }
.itin .ctl { position: relative; display: flex; gap: 4px; align-items: center; }
.itin .durw { position: relative; }
.itin .durw::after { content: "▾"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 9px; color: var(--ink-2); pointer-events: none; }
.itin .dur { appearance: none; -webkit-appearance: none; font: 600 11.5px var(--f-mono); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 18px 3px 6px; cursor: pointer; }
.itin .dur:hover, .itin .dur:focus-visible { border-color: var(--line); background: var(--chip); outline: none; }
/* reorder and remove float over the end of the name while the row is hovered: no space kept for them */
.itin .mv { position: absolute; right: 100%; top: 50%; translate: 0 -50%; display: flex; gap: 2px; padding-left: 18px;
  background: linear-gradient(90deg, transparent, var(--chip) 16px); opacity: 0; pointer-events: none; transition: opacity .12s; }
.itin .st:hover .mv, .itin .st:focus-within .mv { opacity: 1; pointer-events: auto; }
@media (hover: none) { .itin .mv { position: static; translate: none; padding: 0; background: none; opacity: 1; pointer-events: auto; } }
/* dragging a place to a new spot in the day: a line where it will land */

<script>
"use strict";
// ---------- projection (matches build/process.py) ----------
const R = 6378.137, D2R = Math.PI / 180, ORIGIN = [14, 49];
const merc = (lon, lat) => [R * lon * D2R, -R * Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2))];
const [OX, OY] = merc(...ORIGIN);
const P = (lon, lat) => { const [x, y] = merc(lon, lat); return [x - OX, y - OY]; };

// ---------- trip content ----------
const CITIES = {
  prague: { en: "Prague", local: "Praha", ll: [14.4213, 50.0875], nights: 4 },
  vienna: { en: "Vienna", local: "Wien", ll: [16.3725, 48.2085], nights: 4 },
  split: { en: "Split", local: "Split", ll: [16.4401, 43.5081], nights: 4 },
};
for (const c of Object.values(CITIES)) c.xy = P(...c.ll);
for (const id of Object.keys(CITIES)) Object.defineProperty(CITIES[id], "nights", { get: () => PLAN.nights[id] }); // edited in the planner


const TOWNS = [["Bratislava", 17.107, 48.148], ["Budapest", 19.040, 47.498], ["Dresden", 13.738, 51.050], ["Berlin", 13.405, 52.520],
  ["Zurich", 8.541, 47.377], ["Ljubljana", 14.506, 46.056], ["Kraków", 19.945, 50.065], ["Innsbruck", 11.404, 47.269],
  ["Nuremberg", 11.077, 49.452], ["Wrocław", 17.038, 51.108], ["Leipzig", 12.374, 51.340],
  ["Rijeka", 14.442, 45.327], ["Zadar", 15.231, 44.119], ["Šibenik", 15.896, 43.735], ["Sarajevo", 18.413, 43.856], ["Dubrovnik", 18.094, 42.650]];

// legs come from data/legs.json: stations [name, lon, lat, major?] plus a path traced along real OSM track in each city
let LEGS = {};
function buildLegs(data) {
  LEGS = data;
  for (const l of Object.values(LEGS)) {
    l.spts = l.stations.map(s => P(s[1], s[2]));
    l.pts = l.path;
    l.path2d = new Path2D(); addAbs(l.path2d, l.pts.flat(), false);
    l.cum = [0];
    for (let i = 1; i < l.pts.length; i++) l.cum.push(l.cum[i - 1] + Math.hypot(l.pts[i][0] - l.pts[i - 1][0], l.pts[i][1] - l.pts[i - 1][1]));
  }
}

const BOARDS = {
  pv: { rows: [["4h 00", "Railjet · ČD / ÖBB", "every 2 h", "€20+"], ["4h 15", "RegioJet train", "several daily", "€15+"], ["4h 30", "FlixBus coach", "several daily", "€15+"]],
    via: "Pardubice · <b>Brno</b> · Břeclav", stop: "<b>Worth a stop:</b> Brno, a lively student city right at the halfway point. Easy lunch break." },
  vs: { rows: [["", "OPTION A · TRAIN + SLEEPER", "", ""], ["6h 30", "Day train to Zagreb · ÖBB / SŽ / HŽ", "1–2 daily", "€30+"], ["~9h", "Sleeper to Split · HŽ (summer)", "nightly", "€40+"],
      ["", "OPTION B · FLY", "", ""], ["1h 15", "Flight VIE → SPU · Austrian / Croatia Airlines", "daily in summer", "€80+"]],
    via: "<b>Semmering</b> · Graz · Maribor · <b>Zagreb</b> · Knin",
    stop: "<b>Option A:</b> about 6.5 h awake on the day train over the UNESCO-listed Semmering railway, an evening in Zagreb, then sleep through Lika and wake up on the coast. <b>Option B:</b> fly in 1h15 and skip Zagreb. The dashed arc on the map is the flight." },
};

const SEASON = {
  vienna: "In late August the locals head out and the city moves outdoors: wine taverns in the vineyards, long evenings in palace gardens, swimming in the Alte Donau. Expect 25–30°C.",
  prague: "Late summer means long evenings: beer gardens up on the hills, sunsets from the bridges, boats on the Vltava. Warm days around 25°C.",
  split: "Late August is peak beach season: a warm sea around 24°C, long evenings on the Riva, and islands an hour away by boat. Expect 28–32°C.",
};
const EAT_TITLE = { vienna: "Schnitzel, ramen & tapas", prague: "Pilsner, pho & pasta", split: "Fish, octopus & Croatian wine" };

let PLACES = [];        // flattened places with code + city
const DETAIL = {};      // day-trip zoom-in areas (salzburg, lednice) -> {en, local, parent}
let HOODS = {};         // city -> [{name, blurb, rings, label}] historic neighborhood outlines
const placeBy = {};     // `${city}:${code}`

function slideDeck() {
  const s = [];
  s.push({ id: "intro", color: "--ink-2", view: () => W < 760 ? fitLL([13.9, 43.3, 17.0, 50.3]) : fitLL([11.5, 42.8, 19.5, 51.2]), html: introHTML });
  const order = [["prague", "pv", 1], ["vienna", "vs", 2], ["split", null, 3]];
  for (const [city, leg, n] of order) {
    s.push({ id: city, city, color: `--${city}`, focus: ["A", "B", "C", "D"], view: () => fitPts(cityPts(city, ["A", "B", "C", "D"]), 60), html: () => cityHTML(city, n) });
    const eat = PLACES.filter(p => p.city === city && (p.type === "food" || p.type === "cafe")).map(p => p.code); // every restaurant + the café
    s.push({ id: `${city}-eat`, city, color: `--${city}`, focus: eat, view: () => fitPts(cityPts(city, eat), 60), html: () => eatHTML(city) });
    s.push({ id: `${city}-stay`, city, color: `--${city}`, focus: ["H1", "H2", "H3"], view: () => { const pts = cityPts(city, ["H1", "H2", "H3"]); return pts.length ? fitPts(pts, 70, 2.6) : fitPts([CITIES[city].xy], 70, 4); }, html: () => stayHTML(city) });
    const trips = PLACES.filter(p => p.city === city && (p.type === "daytrip" || p.type === "nature")).map(p => p.code); // every trip, however many
    s.push({ id: `${city}-out`, city, color: `--${city}`, focus: trips, view: () => fitPts([CITIES[city].xy, ...cityPts(city, trips)], 70), html: () => outHTML(city) });
    for (const t of PLACES.filter(p => p.city === city && p.detail)) {
      const dc = t.detail;
      s.push({ id: dc, city: dc, side: `${city}-out`, color: `--${city}`, focus: ["A", "B", "C", "D"], view: () => fitPts(cityPts(dc, ["A", "B", "C", "D"]), 60), html: () => detailHTML(dc, t) });
    }
    if (!leg) continue;
    s.push({ id: leg, leg, color: `--${LEGS[leg].from}`, color2: `--${LEGS[leg].to}`, view: () => fitPts(LEGS[leg].pts, 70), html: () => legHTML(leg, n) });
    // stopovers on this leg (e.g. an evening in Zagreb between trains) follow the leg in the main flow
    for (const [dc, d] of Object.entries(DETAIL)) if (d.stop === leg)
      s.push({ id: dc, city: dc, color: `--${PC[dc] ? dc : LEGS[leg].to}`, focus: ["A", "B", "C", "D", "1"], view: () => fitPts(cityPts(dc, ["A", "B", "C", "D", "1"]), 60), html: () => stopHTML(dc) });
  }
  s.push({ id: "in", color: "--ink-2", view: () => fitPts(Object.values(CITIES).map(c => c.xy), 70), html: wrapHTML });
  // human-readable names for the progress bar preview
  const LBL = { intro: "Intro: the trip at a glance", route: "The route: one line across the map", in: "Summary: travel times & costs" };
  const PART = { eat: "eat & drink", stay: "where to stay (Airbnbs)", out: "day trips & nature" };
  for (const sl of s) {
    if (LBL[sl.id]) sl.label = LBL[sl.id];
    else if (sl.leg) { const L = LEGS[sl.leg]; sl.label = `Train: ${CITIES[L.from].en} → ${CITIES[L.to].en}${L.optional ? " (optional)" : ""}${sl.leg === "vs" ? " (day train + sleeper)" : ""}`; }
    else if (DETAIL[sl.id]) sl.label = DETAIL[sl.id].stop ? `Stopover: an evening in ${DETAIL[sl.id].en}` : `Day trip zoom-in: ${DETAIL[sl.id].en}`;
    else { const [c, part] = sl.id.split("-"); sl.label = `${CITIES[c].en}: ${PART[part] || "sights & historic neighborhoods"}`; }
  }
  return s;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { regional: "Regional", splurge: "Splurge", cafe: "Café", world: "World food", nature: "Nature", daytrip: "Day trip" };

function railHours() { // hours awake on trains: Prague–Vienna, Vienna–Zagreb, and Zagreb–Split by day
  return 4 + 6.5 + (byRail() && PLAN.nights.zagreb && PLAN.legs.zs.opt === "day" ? 6.25 : 0);
}
function introHTML() {
  const fly = PLAN.legs.vs.opt === "flight", zn = byRail() ? PLAN.nights.zagreb : 0;
  return `<p class="eyebrow">${planRange()} ${DAYS[0].date.getFullYear()} · ${DAYS.length} days</p>
  <h1>Praha <span class="arrow">→</span> Wien <span class="arrow">→</span> ${fly ? "" : `Zagreb <span class="arrow">→</span> `}Split</h1>
  <p class="lede">Two old imperial capitals, then a sleeper train down to the Adriatic. Castles, coffee houses and wine taverns first, then sea, islands and old stone.</p>
  <dl class="stats"><div><dt>Cities</dt><dd>${fly ? 3 : 4}</dd></div><div><dt>Nights</dt><dd>${totalNights()}</dd></div><div><dt>Of us</dt><dd>11</dd></div><div><dt>${fly ? "Travel" : "Awake on trains"}</dt><dd>${fly ? "~5.5 h" : `~${+railHours().toFixed(1)} h`}</dd></div></dl>
  <p class="hint"><span class="kb">Press <kbd>→</kbd> or Next</span><span class="tch">Tap Next</span> to fly through it, use the city menus at the top, or pick a day in <b>Plan</b> to see its route and pin places to it. Your plan is saved in this browser.</p>`;
}
function badge(p) {
  return pinBadge(p);
}
function thumb(p) {
  return p.img ? `<img class="thumb" src="${esc(p.thumb || p.img)}" alt="${esc(p.name)}" loading="lazy" decoding="async">` : `<span class="thumb"></span>`;
}
function li(p, extra = "") {
  const chip = p.kind ? `<span class="chip ${p.kind === "regional" ? "regional" : ""}">${KIND[p.kind]} · ${esc(p.tag)}</span>` : "";
  const at = !/stay|daytrip|nature/.test(p.type) && pinDays(keyOf(p))[0]; // day trips show theirs in a fuller line
  if (at) extra = `<p class="planned"><span>Pinned</span> ${fmtDay(at.date)}</p>` + extra;
  const drag = p.type === "stay" ? "" : ` draggable="true" data-dpin="${p.city}:${p.code}" title="Drag onto a day in the plan"`;
  return `<li tabindex="0" data-p="${p.city}:${p.code}"${drag}>${thumb(p)}<div class="txt"><div class="name">${badge(p)}<span>${esc(p.name)}</span> ${chip}${rowAct(p)}</div><p>${esc(p.blurb)}</p>${extra}</div></li>`;
}
// a place row's own button: pin it to a day, or (an Airbnb) make it home base
function rowAct(p) {
  const k = keyOf(p);
  if (p.type === "stay") { const on = PLAN.stays[p.city] === p.code; return PC[p.city] ? `<button class="ract${on ? " on" : ""}" data-home="${k}" aria-pressed="${on}" title="${on ? "Our home base" : "Use as home base"}" aria-label="Use ${esc(p.name)} as home base">⌂</button>` : ""; }
  const sel = pinSelect(p); if (!sel) return "";
  return `<label class="ract${pinDays(k).length ? " on" : ""}" title="${pinDays(k).length ? `Pinned: ${pinDays(k).map(x => fmtDay(x.date)).join(", ")}` : "Pin to a day"}"><span aria-hidden="true">📌</span>${sel}</label>`;
}
function hoodList(city) {
  const hs = HOODS[city] || [];
  if (!hs.length) return "";
  return `<h3 class="sub"><span class="ring"></span>Historic neighborhoods</h3>
  <ul class="hoods">${hs.map(h => `<li><b>${esc(h.name)}</b> ${esc(h.blurb)}</li>`).join("")}</ul>`;
}
function plannedChip(p) {
  const at = pinDays(keyOf(p))[0];
  return `<p class="planned${at ? "" : " none"}"><span>${at ? "Pinned" : "Not pinned"}</span> ${at ? fmtDay(at.date) : ""} <a href="#" data-plan="1">${at ? "Change" : "Pin it to a day"}</a></p>`;

    const s = e.stop; if (!s || s.kind === "place" || seen.has(s.name)) continue;
    seen.add(s.name);
    const [x, y] = toS(s.xy); if (!inView(x, y)) continue;
    const crowded = named.some(([a, b]) => Math.abs(a - x) < 150 && Math.abs(b - y) < 18); // stops close together keep one label
    if (!crowded) named.push([x, y]);
    if (s.kind === "home" && s.place) { // our Airbnb: its own chip, the same at every zoom (drawPins leaves it to us)
      const [hw] = pinChip(s.place, x, y, true, 1); ctx.globalAlpha = 1;
      hits.push({ x, y, r: hw + 6, grab: hw + 1, place: s.place });
      continue;
    }
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - 11, y - 11, 22, 22, 5) : ctx.rect(x - 11, y - 11, 22, 22);
    ctx.fillStyle = C.halo; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
    text(HUB_ICON[s.kind], x, y + 1, { size: s.kind === "home" ? 15 : 12, weight: 700, color: C.ink, align: "center", halo: 0 });
    if (!crowded && (s.kind !== "home" || !s.place)) text(s.name, x + 16, y, { size: 12, weight: 600, color: C.ink, halo: 3.5 });
  }
  for (const [x, y, t] of chips) text(t, x, y, { size: 11.5, weight: 600, fam: "--f-mono", color: C.ink, align: "center", halo: 4 });
}
// "Play the day": the camera flies stop to stop and opens each place, like the slides do
async function playDay() {
  if (!daySl) { if (plSel == null) return; goDay(plSel); await new Promise(r => setTimeout(r, 900)); }
  const tok = ++playTok, it = daySl.it;
  for (let i = 0; i < it.length; i++) {
    const s = it[i].stop; if (!s) continue;
    if (tok !== playTok || !daySl) return;
    closePop();
    const full = s.place && (s.kind === "place" || s.kind === "home"); // a place or our Airbnb: its usual popup
    const r = popViewRect(full), k = full ? 420 : 180;
    await new Promise(res => flyTo(d3.zoomIdentity.translate(r.x + r.w / 2 - s.xy[0] * k, r.y + r.h / 2 - s.xy[1] * k).scale(k), res));
    if (tok !== playTok) return;
    if (full) openPop(s.place); else openStopPop(s, it.slice(i + 1).find(e => e.hop)?.hop);
    await new Promise(res => setTimeout(res, full ? 2200 : 1600));
  }
  if (tok === playTok && daySl) { closePop(); flyTo(daySl.view()); }
}

// ---------- menu bar: a tab per city, straight to its slides ----------

  mbItems.innerHTML = MENU_IDS.map(id => tab(id, "mbt")).join("");

function openMenu(focus) { mbOpen = true; buildMenu(); if (focus) mbMenu.querySelector("[data-menu]:not([disabled])")?.focus(); }

const DOCK = matchMedia("(min-aspect-ratio: 3/2) and (min-width: 1100px)");

uiWatch.observe(calPanel);
const tBtn = document.getElementById("transitBtn"), tMenu = document.getElementById("transitMenu");

document.addEventListener("click", e => { if (!tMenu.hidden && !e.target.closest(".tmenu")) { tMenu.hidden = true; tBtn.setAttribute("aria-expanded", "false"); } });
addEventListener("keydown", e => {
  if (!viewer.hidden) { // the photo viewer owns the keyboard while it's open
    if (e.key === "Escape") closeViewer();
    else if (["ArrowRight", "PageDown", " "].includes(e.key)) showPhoto(vIdx + 1);
    else if (["ArrowLeft", "PageUp"].includes(e.key)) showPhoto(vIdx - 1);
    else if (e.key === "Tab") { // keep focus on the viewer's own buttons
      const bs = [...viewer.querySelectorAll("button:not([hidden])")], at = bs.indexOf(document.activeElement);
      bs[(at + (e.shiftKey ? -1 : 1) + bs.length) % bs.length].focus();

card.addEventListener("click", e => {
  const jump = e.target.closest("[data-go]");
  if (jump) { e.preventDefault(); e.stopPropagation(); go(slides.findIndex(s => s.id === jump.dataset.go)); return; }

cardNav.addEventListener("click", e => {

// a stop in the open day's list: fly there and open its popup (a place's, our Airbnb's, or a station's small one)
function focusStop(i) {
  const it = daySl?.it || (plSel != null ? itinerary(DAYS[plSel]) : null), s = it?.[i]?.stop;
  if (!s) return;
  if (s.place && (s.kind === "place" || s.kind === "home")) { focusPlace(s.place); return; }
  closePop();
  const r = popViewRect(false), k = Math.max(T.k, 180);
  flyTo(d3.zoomIdentity.translate(r.x + r.w / 2 - s.xy[0] * k, r.y + r.h / 2 - s.xy[1] * k).scale(k), () => openStopPop(s, it.slice(i + 1).find(e => e.hop)?.hop));
}
function focusPlace(p) {
  closePop();
  const r = popViewRect(true), k = Math.max(T.k, p.type === "area" ? 260 : p.type === "stay" ? 380 : 520);
  flyTo(d3.zoomIdentity.translate(r.x + r.w / 2 - p.xy[0] * k, r.y + r.h / 2 - p.xy[1] * k).scale(k), () => openPop(p));

// map clicks: pins and city markers
function hitAt(ev) {
  const b = cv.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top;
  let best = null, bd = Infinity;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } }
  return best;
}
cv.addEventListener("click", ev => {
  if (eatClick) { eatClick = false; return; } // the end of a drag, not a click
  const h = hitAt(ev);
  if (!h) { if (openPlace) closePop(); return; }
  if (h.place) openPop(h.place);
  else if (h.city) go(slides.findIndex(s => s.id === h.city));
});
addEventListener("hashchange", () => {
  const h = location.hash.slice(1), d = DAYS.findIndex(x => `day-${x.iso}` === h);
  if (d >= 0) { if (!daySl || daySl.i !== d) goDay(d); return; }
  const i = slides.findIndex(s => s.id === h);
  if (i >= 0 && i !== cur) go(i);
});
cv.addEventListener("mousemove", ev => { if (mapDrag) return; cv.classList.toggle("pointing", !!hitAt(ev)); cv.classList.toggle("grab", !!grabAt(ev)); });

// drag a pin off the map onto a calendar day; only a press on the icon itself starts it, anywhere else pans
function grabAt(ev) {
  const pt = ev.touches ? ev.touches[0] : ev, b = cv.getBoundingClientRect(), x = pt.clientX - b.left, y = pt.clientY - b.top;
  const h = hits.find(h => h.place && h.place.type !== "stay" && Math.hypot(h.x - x, h.y - y) < h.grab);
  return h ? h.place : null;
}
zoom.filter(ev => (!ev.ctrlKey || ev.type === "wheel") && !ev.button && (ev.type === "wheel" || !grabAt(ev)));
let mapDrag = null, eatClick = false;
const ghost = document.createElement("div"); ghost.id = "ghost"; ghost.hidden = true; document.body.append(ghost);
cv.addEventListener("pointerdown", ev => {
  const p = ev.button ? null : grabAt(ev); if (!p) return;

});
cv.addEventListener("pointermove", ev => {
  if (!mapDrag) return;

    mapDrag.on = true; dragPin = { key: keyOf(mapDrag.p), from: null };
    if (calPanel.hidden) setCal(true); // somewhere to drop it
    ghost.innerHTML = `${pinBadge(mapDrag.p)}<span>${esc(mapDrag.p.name)}</span>`; ghost.style.setProperty("--c", `var(--${homeOf(mapDrag.p)})`);
    ghost.hidden = false; document.body.classList.add("pindrag"); closePop();
  }
  ghost.style.transform = `translate(${ev.clientX + 12}px, ${ev.clientY + 10}px)`;
  const cell = document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.(".cal.planner [data-day]");
  calPanel.querySelectorAll(".cd.drop-ok, .cd.drop-no").forEach(c => c !== cell && c.classList.remove("drop-ok", "drop-no"));
  if (cell) { const ok = pinDropOk(DAYS[+cell.dataset.day]); cell.classList.toggle("drop-ok", ok); cell.classList.toggle("drop-no", !ok); }
});
function endMapDrag(ev, drop) {
  if (!mapDrag) return;
  const { on } = mapDrag; mapDrag = null;
  if (!on) return; // a plain click: the click handler opens the popup

  const cell = drop && document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.(".cal.planner [data-day]");
  if (cell && pinDropOk(DAYS[+cell.dataset.day])) dropPin(cell);

cv.addEventListener("pointerup", ev => endMapDrag(ev, true));

// ---------- boot ----------
const DATA_V = "32"; // bump when data files change so browsers don't reuse stale copies
async function boot() {
  readTheme(); resize();
  invalidate();
  const [region, places, stays, images, legs, hoods, trips] = await Promise.all(["region", "places", "stays", "images", "legs", "hoods", "trips"].map(n => fetch(`data/${n}.json?v=${DATA_V}`).then(r => r.json())));
  buildRegion(region); buildLegs(legs); buildPlaces(places, stays, images); HOODS = hoods; TRIP_ROUTES = trips;
  for (const [c, h] of Object.entries(HUB)) { // each airport at its transfer route's airport end
    const r = h.air && TRIP_ROUTES[`air:${c}`]; if (!r) continue;
    const ends = [r.segs[0].pts[0], r.segs.at(-1).pts.at(-1)], d = p => Math.hypot(p[0] - h.air.xy[0], p[1] - h.air.xy[1]);
    h.air.xy = d(ends[0]) < d(ends[1]) ? ends[0] : ends[1];
  }
  for (const hs of Object.values(HOODS)) for (const h of hs) { h.path = new Path2D(); for (const ring of h.rings) addAbs(h.path, ring.flat(), true); }
  TRIPS = PLACES.filter(p => p.type === "nature" || p.type === "daytrip");
  migratePlan();
  DAYS = buildDays();
  slides = slideDeck(); buildNav();
  (window.requestIdleCallback || setTimeout)(() => loadLand("land"), { timeout: 3000 }); // country detail, once the page is up
  document.getElementById("loading").remove();
  document.body.classList.toggle("dock", DOCK.matches);
  const h = location.hash.slice(1), start = Math.max(0, slides.findIndex(s => s.id === h)), d = DAYS.findIndex(x => `day-${x.iso}` === h);
  cur = start;
  if (d >= 0) goDay(d, { instant: true }); else go(start, { instant: true });
  applyDock(); fitMenubar();
  if (sharedPending) setCal(true); // someone sent a plan: show it with the keep / discard choice
  document.fonts && document.fonts.ready.then(() => { invalidate(); });
  ensureTransit(); syncTransitUI();
  readTheme();
}
// city and day-trip maps load when needed: for the slide on screen and its neighbours, or when the
// camera gets close to one (anchored at the city, or at the day-trip area's own places)
const cityReq = {};
function needCity(name) {
  if (!name || cityReq[name] || !(name in CITIES || name in DETAIL)) return;
  cityReq[name] = fetch(`data/${name}.json?v=${DATA_V}`).then(r => r.json()).then(c => buildCity(name, c))
    .catch(() => { delete cityReq[name]; }); // try again next time it's needed
}
function needNear() {
  for (const name of [...Object.keys(CITIES), ...Object.keys(DETAIL)]) {
    if (cityReq[name]) continue;
    const at = CITIES[name]?.xy || PLACES.find(p => p.city === name)?.xy;
    if (!at) continue;
    const [x, y] = toS(at);
    if (inView(x, y, Math.max(W, H) / 2)) needCity(name);
  }
}
boot().catch(err => { document.getElementById("loading").textContent = "The map data didn't load. Reload the page to try again."; console.error(err); });
